<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stephie's World · Stephanie Del Paggio</title>
  <meta name="description" content="The personal world of Stephanie Del Paggio, writer, tinkerer, and wanderer based in New York.">
  <meta name="keywords" content="Stephanie Del Paggio, Stephie Del Paggio, writer, New York, tech, literary fiction">
  <meta property="og:title" content="Stephie's World · Stephanie Del Paggio">
  <meta property="og:description" content="Writer, tinkerer, wanderer. A personal universe.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://stephiesworld.com/world.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="world.css">
  <style>
    .hub { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

    .hub-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px var(--page-pad) 0;
    }
    .hub-header .back {
      font-family: var(--serif); font-style: italic; font-size: 13px;
      color: var(--ink-mute); display: inline-flex; gap: 8px; transition: color .4s, gap .4s;
    }
    .hub-header .back:hover { color: var(--cherry); gap: 12px; }
    .hub-header .contact {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--ink-mute); transition: color .4s;
    }
    .hub-header .contact:hover { color: var(--cherry); }

    .hub-hero { text-align: center; padding: 64px var(--page-pad) 20px; }
    .hub-hero h1 {
      font-family: var(--serif); font-style: italic; font-weight: 500;
      font-size: clamp(52px, 9vw, 132px); line-height: 0.94;
      letter-spacing: -0.015em; margin: 0; color: var(--cherry);
      opacity: 0; animation: rise 1.4s ease 0.15s forwards;
    }
    .hub-hero .sub {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(15px, 1.3vw, 19px); color: var(--ink-soft);
      margin: 20px 0 0; letter-spacing: 0.02em;
      opacity: 0; animation: rise 1.4s ease 0.5s forwards;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .chart-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 12px var(--page-pad) 40px; position: relative; min-height: 560px;
    }
    .chart {
      position: relative; width: min(760px, 94vw); aspect-ratio: 1 / 0.8;
      transition: transform 0.9s cubic-bezier(0.2,0.8,0.2,1);
    }
    .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .chart-frame { fill: none; stroke: var(--rule); stroke-width: 0.5; }
    .chart-tick { fill: none; stroke: var(--ink-faint); stroke-width: 0.7; }
    .chart-orbit { fill: none; stroke: rgba(139,30,47,0.12); stroke-width: 0.6; }
    .chart-constellation {
      fill: none; stroke: rgba(139,30,47,0.24); stroke-width: 0.6;
      stroke-linejoin: round;
      stroke-dasharray: 4000; stroke-dashoffset: 4000;
      animation: draw 4.5s ease 0.4s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .chart-coord { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.18em; fill: var(--ink-faint); }

    .node {
      position: absolute; transform: translate(-50%, -50%);
      text-align: center; cursor: pointer;
      opacity: 0; animation: rise 0.7s ease forwards;
    }
    .node .dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--cherry-bright);
      margin: 0 auto 9px; box-shadow: 0 0 0 0 var(--glow);
      animation: pulse 4.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,30,47,0.28); transform: scale(1); }
      50% { box-shadow: 0 0 0 7px rgba(139,30,47,0); transform: scale(1.22); }
    }
    .node .name {
      font-family: var(--serif); font-style: italic; font-size: 15px;
      color: var(--cherry); letter-spacing: 0.02em; white-space: nowrap;
      transition: color .4s;
    }
    .node .name .ext { font-size: 0.7em; vertical-align: 0.4em; opacity: 0.6; margin-left: 2px; }
    .node .tease {
      font-family: var(--serif); font-style: italic; font-size: 12px;
      color: var(--cherry-bright); margin-top: 4px; white-space: nowrap;
      opacity: 0; transform: translateY(-4px); transition: opacity .45s, transform .45s;
    }
    .node:hover .name { color: var(--cherry-bright); }
    .node:hover .dot { transform: scale(1.35); }
    .node:hover .tease { opacity: 1; transform: translateY(0); }

    .core {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 2;
    }
    .core .crest {
      font-family: Georgia, serif; font-size: 46px; color: var(--cherry-bright);
      line-height: 1; display: inline-block;
      filter: drop-shadow(0 0 20px var(--glow));
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.09); opacity: 1; } }

    .hub-foot { text-align: center; padding: 40px var(--page-pad) 44px; }
    .hub-foot .q {
      font-family: var(--serif); font-style: italic; font-size: 14px;
      color: var(--ink-mute); max-width: 560px; margin: 0 auto 16px; line-height: 1.6;
    }
    .hub-foot .attrib { font-family: var(--mono); font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase; }
    .hub-foot .attrib a { color: var(--ink-mute); transition: color .3s; }
    .hub-foot .attrib a:hover { color: var(--cherry); }
    .hub-foot .maktub { direction: rtl; font-family: var(--serif); font-size: 15px; color: var(--ink-faint); margin: 0 6px; }

    @media (max-width: 760px) {
      .chart-wrap { min-height: 0; padding: 8px 1.2rem 24px; }
      .chart { width: 100%; aspect-ratio: auto; }
      .chart svg { display: none; }
      .chart { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 12px; }
      .node { position: static; transform: none; }
      .node .tease { opacity: 1; transform: none; }
      .core { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chart-constellation, .node .dot, .core .crest { animation: none !important; }
      .chart, .hub-hero h1, .hub-hero .sub, .node { animation: none !important; opacity: 1 !important; }
      .chart-constellation { stroke-dashoffset: 0 !important; }
    }
  </style>
</head>
<body>

  <div class="hub">
    <header class="hub-header">
      <a href="index.html" class="back"><em>← the door</em></a>
      <a href="mailto:stephiesuniverse@gmail.com" class="contact">say hello</a>
    </header>

    <section class="hub-hero">
      <h1>Stephie&rsquo;s World</h1>
      <p class="sub">a personal universe</p>
    </section>

    <main class="chart-wrap">
      <div class="chart" id="chart">
        <div class="core"><span class="crest">&#10086;</span></div>
      </div>
    </main>

    <footer class="hub-foot">
      <p class="q" id="footerQuote"></p>
      <p class="attrib">
        <a href="mailto:stephiesuniverse@gmail.com">say hello</a>
        <a href="https://stephiesuniverse.substack.com" target="_blank" rel="noopener" class="maktub">مكتوب</a>
      </p>
    </footer>
  </div>

  <script src="quotes.js"></script>
  <script>
    (function () {
      var NODES = [
        { label: 'About',            tease: 'between shanghai & new york',  href: 'about.html' },
        { label: 'Reading',          tease: 'four on the nightstand',       href: 'reading.html' },
        { label: 'Art',              tease: 'quiet, atmospheric, other',    href: 'art.html' },
        { label: 'Cities I love',    tease: 'the ones I go back to',        href: 'cities.html' },
        { label: 'Ideas',            tease: 'the inner game',               href: 'ideas.html' },
        { label: 'Projects',         tease: 'a novel, in progress',         href: 'projects.html' },
        { label: 'Career',           tease: 'wealth, razors, a startup',    href: 'career.html' },
        { label: 'Tennis',           tease: 'the sport is a mirror',        href: 'tennis.html' },
        { label: 'Curiosities',      tease: 'the cabinet',  href: 'https://stephiesuniverse.substack.com', ext: true }
      ];

      // Slight hand-placed irregularity so the chart reads as drawn, not generated.
      var JITTER = [0.00, 0.03, -0.04, 0.02, -0.02, 0.04, -0.03, 0.02, -0.05];

      var chart = document.getElementById('chart');
      var W = 1000, H = 800, cx = W / 2, cy = H / 2, rx = W * 0.375, ry = H * 0.375;

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svg.setAttribute('aria-hidden', 'true');

      function el(name, attrs) {
        var e = document.createElementNS(svgNS, name);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }

      // registration frame + corner ticks
      svg.appendChild(el('rect', { x: 30, y: 24, width: W - 60, height: H - 48, class: 'chart-frame' }));
      var m = 30, t = 24, s = 22;
      svg.appendChild(el('path', { class: 'chart-tick', d:
        'M'+m+' '+(t+s)+' L'+m+' '+t+' L'+(m+s)+' '+t+
        ' M'+(W-m-s)+' '+t+' L'+(W-m)+' '+t+' L'+(W-m)+' '+(t+s)+
        ' M'+(W-m)+' '+(H-t-s)+' L'+(W-m)+' '+(H-t)+' L'+(W-m-s)+' '+(H-t)+
        ' M'+(m+s)+' '+(H-t)+' L'+m+' '+(H-t)+' L'+m+' '+(H-t-s) }));

      // ghost orbits
      svg.appendChild(el('ellipse', { cx: cx, cy: cy, rx: rx, ry: ry, class: 'chart-orbit' }));
      svg.appendChild(el('ellipse', { cx: cx, cy: cy, rx: rx * 0.52, ry: ry * 0.52, class: 'chart-orbit' }));

      // one quiet coordinate label (New York)
      var coord = el('text', { x: W - 42, y: 44, 'text-anchor': 'end', class: 'chart-coord' });
      coord.textContent = '40°43′N · 74°W';
      svg.appendChild(coord);

      var pts = NODES.map(function (n, i) {
        var a = (Math.PI * 2 * i) / NODES.length - Math.PI / 2;
        var jr = 1 + JITTER[i];
        return { x: cx + Math.cos(a) * rx * jr, y: cy + Math.sin(a) * ry * jr, a: a };
      });

      var poly = el('polygon', { points: pts.map(function (p) { return p.x + ',' + p.y; }).join(' '), class: 'chart-constellation' });
      svg.appendChild(poly);
      chart.appendChild(svg);

      NODES.forEach(function (n, i) {
        var p = pts[i];
        var a = document.createElement('a');
        a.className = 'node';
        a.href = n.href;
        if (n.ext) { a.target = '_blank'; a.rel = 'noopener'; }
        a.style.left = (p.x / W * 100) + '%';
        a.style.top = (p.y / H * 100) + '%';
        a.style.animationDelay = (0.25 + i * 0.12) + 's';
        a.innerHTML =
          '<div class="dot" style="animation-delay:' + (i * 0.35) + 's"></div>' +
          '<div class="name"><em>' + n.label + '</em>' + (n.ext ? '<span class="ext">↗</span>' : '') + '</div>' +
          '<div class="tease">' + n.tease + '</div>';
        chart.appendChild(a);
      });

      // gentle parallax
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && !window.matchMedia('(hover: none)').matches) {
        var tx = 0, ty = 0, cxp = 0, cyp = 0, raf = false;
        window.addEventListener('mousemove', function (e) {
          tx = (e.clientX / window.innerWidth - 0.5) * 14;
          ty = (e.clientY / window.innerHeight - 0.5) * 14;
          if (!raf) { raf = true; requestAnimationFrame(function () {
            cxp += (tx - cxp) * 0.08; cyp += (ty - cyp) * 0.08;
            chart.style.transform = 'translate(' + cxp.toFixed(1) + 'px,' + cyp.toFixed(1) + 'px)';
            raf = false;
          }); }
        });
      }

      if (typeof setRandomQuote === 'function') setRandomQuote();
    })();
  </script>

</body>
</html>
