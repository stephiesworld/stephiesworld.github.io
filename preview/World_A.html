<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stephie's World · a personal universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/site.css" />
<style>
  .wa-core .crest-svg { width: 64px; height: 64px; animation: wa-breathe 6s ease-in-out infinite; filter: drop-shadow(0 0 18px var(--glow)); }
  #tweaks {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--paper); padding: 16px 18px;
    border: 1px solid var(--rule);
    box-shadow: 0 20px 60px rgba(42,26,24,0.15);
    font-family: var(--serif); font-style: italic;
    transform: translateY(20px); opacity: 0; pointer-events: none;
    transition: transform .4s, opacity .4s;
    max-width: 320px;
  }
  #tweaks.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #tweaks .tw-title { font-size: 18px; margin-bottom: 10px; color: var(--ink); }
  #tweaks label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-mute); font-style: normal; display: block; margin-bottom: 8px; }
  #tweaks .tw-seg { display: flex; flex-wrap: wrap; gap: 4px; }
  #tweaks .tw-seg button {
    background: transparent; border: 1px solid var(--rule);
    padding: 4px 10px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: lowercase;
    color: var(--ink-mute); cursor: pointer;
  }
  #tweaks .tw-seg button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
</style>
</head>
<body>

<div class="stage-a">

  <header class="wa-header">
    <a class="back" href="#"><em>← stephiesworld.com</em></a>
    <a class="contact" href="mailto:stephiesuniverse@gmail.com">say hello</a>
  </header>

  <section class="wa-hero">
    <div class="vol">vol. i · an archive of a life</div>
    <h1><em>Stephie's World</em></h1>
    <div class="sub">a personal universe, kept in letters and small stones</div>
    <div class="date">april · mmxxvi</div>
  </section>

  <div class="wa-constellation-wrap">
    <div class="wa-stars" id="stars"></div>
    <div class="wa-constellation" id="constellation">
      <!-- dynamic svg + nodes injected by script -->
    </div>
  </div>

  <footer class="wa-footer">
    <p class="q"><em>"What is done out of love always takes place beyond good and evil."</em></p>
    <div class="mark">✶</div>
    <div class="attrib">say hello · مكتوب</div>
  </footer>

</div>

<script>
(function () {
  const NODES = [
    { id: 'about',    label: 'About',               tease: 'between shanghai & new york',    href: 'About.html' },
    { id: 'reading',  label: 'Reading',             tease: 'four books at once, always',     href: 'Reading.html' },
    { id: 'art',      label: 'Art',                 tease: 'quiet, atmospheric, slightly other', href: 'Art.html' },
    { id: 'cities',   label: 'Cities I Love',       tease: 'paris, where beauty is a necessity', href: 'Cities.html' },
    { id: 'ideas',    label: 'Ideas I\u2019m Exploring', tease: 'the inner game',             href: 'Ideas.html' },
    { id: 'projects', label: 'Projects',            tease: 'a novel, in progress',           href: 'Projects.html' },
    { id: 'career',   label: 'Career',              tease: 'morgan stanley, harry\u2019s, little bun, amazon', href: 'Career.html' },
    { id: 'tennis',   label: 'Tennis',              tease: 'the sport is a mirror',          href: 'Tennis.html' },
    { id: 'curiosities', label: 'Curiosities', tease: '✶ the cabinet',       href: 'Curiosities.html' },
    { id: 'music',    label: 'Music',               tease: '\u2732 newest \u2014 fifteen favorites', href: 'Music.html' },
  ];

  const stage = document.getElementById('constellation');
  const W = stage.clientWidth || 800;
  const H = W * 0.78;
  const cx = W / 2, cy = H / 2;
  const r = Math.min(W, H) * 0.42;

  // SVG rings + polygon
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const ringBig = document.createElementNS(svgNS, 'circle');
  ringBig.setAttribute('cx', cx); ringBig.setAttribute('cy', cy);
  ringBig.setAttribute('r', r * 0.6);
  ringBig.setAttribute('fill', 'none');
  ringBig.setAttribute('stroke', 'var(--ember)');
  ringBig.setAttribute('stroke-opacity', '0.22');
  ringBig.setAttribute('stroke-width', '0.5');
  svg.appendChild(ringBig);

  const ringSmall = document.createElementNS(svgNS, 'circle');
  ringSmall.setAttribute('cx', cx); ringSmall.setAttribute('cy', cy);
  ringSmall.setAttribute('r', r * 0.3);
  ringSmall.setAttribute('fill', 'none');
  ringSmall.setAttribute('stroke', 'var(--ember)');
  ringSmall.setAttribute('stroke-opacity', '0.18');
  ringSmall.setAttribute('stroke-width', '0.5');
  svg.appendChild(ringSmall);

  // polygon connecting nodes
  const points = [];
  const positions = NODES.map((_, i) => {
    const a = (Math.PI * 2 * i) / NODES.length - Math.PI / 2;
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  });
  const poly = document.createElementNS(svgNS, 'polygon');
  poly.setAttribute('points', positions.map(p => `${p.x},${p.y}`).join(' '));
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke', 'var(--ember)');
  poly.setAttribute('stroke-opacity', '0.35');
  poly.setAttribute('stroke-width', '0.5');
  svg.appendChild(poly);

  stage.appendChild(svg);

  // nodes
  NODES.forEach((n, i) => {
    const p = positions[i];
    const a = document.createElement('a');
    a.className = 'wa-node' + (n.id === 'music' ? ' music' : '');
    a.style.left = (p.x / W * 100) + '%';
    a.style.top = (p.y / H * 100) + '%';
    a.href = n.href;
    a.innerHTML = `<div class="dot" style="animation-delay:${i * 0.4}s"></div><div class="name"><em>${n.label}</em></div><div class="tease">${n.tease}</div>`;
    stage.appendChild(a);
  });

  // core — cycle through crest options
  const CREST_OPTIONS = [
    { id: 'heart',   html: '<div class="crest crest-heart">\u2766</div>',              label: 'heart' },
    { id: 'sun',     html: '<svg class="crest-svg" viewBox="0 0 80 80"><g fill="none" stroke="var(--ember)" stroke-width="0.8"><circle cx="40" cy="40" r="14" fill="var(--ember)" fill-opacity="0.12"/><circle cx="40" cy="40" r="10"/>' + Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;const x1=40+Math.cos(a)*18,y1=40+Math.sin(a)*18,x2=40+Math.cos(a)*26,y2=40+Math.sin(a)*26;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join('') + '</g></svg>', label: 'sun' },
    { id: 'compass', html: '<svg class="crest-svg" viewBox="0 0 80 80"><g fill="none" stroke="var(--ember)" stroke-width="0.8"><circle cx="40" cy="40" r="22"/><path d="M40 22 L44 40 L40 58 L36 40 Z" fill="var(--ember)" fill-opacity="0.85" stroke="none"/><path d="M22 40 L40 44 L58 40 L40 36 Z" fill="var(--ember)" fill-opacity="0.3" stroke="none"/><circle cx="40" cy="40" r="2" fill="var(--ember)"/></g></svg>', label: 'compass' },
    { id: 'star',    html: '<svg class="crest-svg" viewBox="0 0 80 80"><g fill="var(--ember)"><path d="M40 14 L44 36 L66 40 L44 44 L40 66 L36 44 L14 40 L36 36 Z" opacity="0.9"/></g></svg>', label: 'star' },
    { id: 'moon',    html: '<svg class="crest-svg" viewBox="0 0 80 80"><g><circle cx="40" cy="40" r="20" fill="var(--ember)" fill-opacity="0.15"/><path d="M46 22 a18 18 0 1 0 0 36 a14 14 0 1 1 0 -36 z" fill="var(--ember)"/></g></svg>', label: 'moon' },
    { id: 'eye',     html: '<svg class="crest-svg" viewBox="0 0 80 80"><g fill="none" stroke="var(--ember)" stroke-width="0.9"><path d="M14 40 Q40 16 66 40 Q40 64 14 40 Z"/><circle cx="40" cy="40" r="8" fill="var(--ember)" fill-opacity="0.85"/><circle cx="40" cy="40" r="3" fill="var(--paper)"/></g></svg>', label: 'eye' },
    { id: 'dots',    html: '<svg class="crest-svg" viewBox="0 0 80 80"><g fill="var(--ember)"><circle cx="40" cy="26" r="3"/><circle cx="54" cy="40" r="3"/><circle cx="40" cy="54" r="3"/><circle cx="26" cy="40" r="3"/><circle cx="40" cy="40" r="1.5" fill-opacity="0.5"/></g></svg>', label: 'cardinal' },
    { id: 'original', html: '<div class="crest">\u2766</div>', label: 'original ❦' },
  ];

  const core = document.createElement('div');
  core.className = 'wa-core';
  stage.appendChild(core);

  let crestIdx = parseInt(localStorage.getItem('sw-crest') || '0', 10);
  function renderCrest() {
    const c = CREST_OPTIONS[crestIdx % CREST_OPTIONS.length];
    core.innerHTML = c.html;
    localStorage.setItem('sw-crest', String(crestIdx));
  }
  renderCrest();

  // Tweaks panel
  const tweak = document.createElement('div');
  tweak.id = 'tweaks';
  tweak.innerHTML = `<div class="tw-title">Tweaks</div>
    <div class="tw-row"><label>centerpiece</label><div class="tw-seg">
      ${CREST_OPTIONS.map((o,i) => `<button data-i="${i}">${o.label}</button>`).join('')}
    </div></div>`;
  document.body.appendChild(tweak);
  tweak.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      crestIdx = parseInt(b.dataset.i, 10);
      renderCrest();
      tweak.querySelectorAll('button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.i,10) === crestIdx));
    });
  });
  function markActive() { tweak.querySelectorAll('button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.i,10) === crestIdx)); }
  markActive();

  // edit-mode bridge
  window.addEventListener('message', (e) => {
    if (!e?.data || typeof e.data !== 'object') return;
    if (e.data.type === '__activate_edit_mode') tweak.classList.add('open');
    if (e.data.type === '__deactivate_edit_mode') tweak.classList.remove('open');
  });
  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}

  // inner tiny stars
  const starField = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 's';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 5) + 's';
    s.style.opacity = (0.15 + Math.random() * 0.4);
    starField.appendChild(s);
  }

  // parallax on mouse
  let tx = 0, ty = 0;
  window.addEventListener('mousemove', (e) => {
    const nx = (e.clientX / window.innerWidth - 0.5) * 12;
    const ny = (e.clientY / window.innerHeight - 0.5) * 12;
    tx += (nx - tx) * 0.06; ty += (ny - ty) * 0.06;
    stage.style.transform = `translate(${tx}px, ${ty}px)`;
    starField.style.transform = `translate(${-tx * 0.6}px, ${-ty * 0.6}px)`;
  });
})();
</script>

</body>
</html>
