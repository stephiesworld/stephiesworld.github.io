<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title — Stephie</title>
  <meta name="description" content="$description">
  <meta name="author" content="Stephie">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="article">
  <link rel="canonical" href="https://stephiesworld.com/writing/$slug.html">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Tilt+Neon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dusk.css?v=20261008">
  <link rel="stylesheet" href="essay.css?v=20261029">
</head>
<body>
  <!-- Generated by tools/build_writing.py from content/essays/$slug.md. Edit the .md, then rebuild. -->

  <div class="progress" id="progress" style="--c:$color"></div>

  <header class="top">
    <a href="../index.html" class="home">Stephie&rsquo;s World</a>
    <nav aria-label="Site">
      <a href="../about.html" class="teal">about</a>
      <a href="../books.html" class="amber">reading</a>
      <a href="../writing.html" class="teal" aria-current="page">writing</a>
      <a href="../builds.html" class="pink">builds</a>
    </nav>
  </header>

  <article class="essay" style="--c:$color">
    <header class="cover">
      <p class="mast label"><span>Stephie&rsquo;s World &middot; late edition</span><span>$category &middot; $byline &middot; $date</span></p>
      <span class="big" aria-hidden="true">$num</span>
      <div class="cover-text">
        <h1>$title</h1>
        <p class="dk">$description</p>
      </div>
      <span class="price label">$minutes min</span>
    </header>

    <div class="sheet">
      <div class="prose">
$body
      </div>
      <p class="end" aria-hidden="true">&#9670; &#9670; &#9670;</p>
    </div>
  </article>

  <nav class="pager" aria-label="More issues">$nav</nav>

  <footer class="site-foot">
    <a href="$back_href">&larr; $back_label</a>
  </footer>

  <script>
    var bar = document.getElementById('progress');
    function progress() {
      var h = document.documentElement;
      var p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
      bar.style.transform = 'scaleX(' + Math.min(1, p) + ')';
    }
    document.addEventListener('scroll', progress, { passive: true });
    progress();
  </script>
  <script src="../secret.js"></script>
</body>
</html>
