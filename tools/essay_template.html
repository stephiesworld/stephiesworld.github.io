<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title — Stephie</title>
  <meta name="description" content="$description">
  <meta name="author" content="Stephie">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="article">
  <link rel="canonical" href="https://stephiesworld.com/writing/$slug.html">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../neon.css">
  <link rel="stylesheet" href="essay.css">
</head>
<body>
  <!-- Generated by tools/build_writing.py from content/essays/$slug.md. Edit the .md, then rebuild. -->

  <div class="progress" id="progress"></div>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="../work.html" class="back-link">&larr; Index of Work</a>
    <nav class="signs" aria-label="Site">
      <a href="../about.html" class="sign teal">about</a>
      <a href="../books.html" class="sign amber">reading</a>
      <a href="../work.html" class="sign pink framed">work &rarr;</a>
    </nav>
  </div>

  <article class="essay">
    <header>
      <p class="kicker hud"><span class="red">No. $num</span> &nbsp;&middot;&nbsp; $category</p>
      <h1>$title</h1>
      <p class="meta hud">$date &nbsp;&middot;&nbsp; $minutes min read &nbsp;&middot;&nbsp; Stephie</p>
    </header>

    <div class="prose">
$body
    </div>
  </article>

  <nav class="pager">$nav</nav>

  <footer>
    <a href="../work.html" class="hud">index of work</a>
  </footer>

  <script>
    var bar = document.getElementById('progress');
    function progress() {
      var h = document.documentElement;
      var p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
      bar.style.transform = 'scaleX(' + Math.min(1, p) + ')';
    }
    document.addEventListener('scroll', progress, { passive: true });
    progress();
  </script>
  <script src="../secret.js"></script>
</body>
</html>
