<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stephie's World — Stephanie Del Paggio</title>
  <meta name="description" content="The personal world of Stephanie Del Paggio — writer, tinkerer, and wanderer based in New York.">
  <meta name="keywords" content="Stephanie Del Paggio, Stephie Del Paggio, writer, New York, tech, literary fiction">
  <meta property="og:title" content="Stephie's World — Stephanie Del Paggio">
  <meta property="og:description" content="Writer, tinkerer, wanderer. A personal universe.">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Stephanie Del Paggio",
    "alternateName": "Stephie Del Paggio",
    "url": "https://stephiesworld.com",
    "jobTitle": "Writer & Technologist",
    "address": { "@type": "PostalAddress", "addressLocality": "New York" }
  }
  </script>
  <link rel="canonical" href="https://stephiesworld.com/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="world.css">
  <style>
    .door {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }
    .door.leaving { opacity: 0; visibility: hidden; }
    .door-inner { position: relative; z-index: 2; text-align: center; }
    .door-crest {
      font-family: Georgia, serif; font-size: 30px; color: var(--cherry-bright);
      opacity: 0; filter: drop-shadow(0 0 16px var(--glow));
      animation: doorRise 1.6s ease 0.1s forwards, breathe 6s ease-in-out 1.6s infinite;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .door-welcome {
      font-family: var(--serif); font-style: italic; font-weight: 500;
      font-size: clamp(46px, 8vw, 84px); letter-spacing: 0.01em;
      color: var(--cherry); margin: 22px 0 34px;
      opacity: 0; animation: doorRise 1.6s ease 0.35s forwards;
    }
    .door-enter {
      background: none; border: none; cursor: pointer; padding: 12px;
      font-family: var(--mono); font-size: 10px; font-weight: 400;
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink-mute);
      opacity: 0; animation: doorRise 1.6s ease 0.95s forwards;
      transition: color 0.4s ease, letter-spacing 0.4s ease;
    }
    .door-enter:hover { color: var(--cherry); letter-spacing: 0.44em; }
    @keyframes doorRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .door-crest, .door-welcome, .door-enter { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>

  <div class="door" id="door">
    <div class="door-inner">
      <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Stephanie Del Paggio</h1>
      <div class="door-crest">&#10086;</div>
      <p class="door-welcome" id="greeting">welcome</p>
      <button class="door-enter" id="enterBtn" aria-label="Enter site"><span>enter</span></button>
    </div>
  </div>

  <script>
    var greetings = ['你好', 'bonjour', 'ciao', 'hola', 'welcome'];
    document.getElementById('greeting').textContent = greetings[Math.floor(Math.random() * greetings.length)];
    document.getElementById('enterBtn').addEventListener('click', function () {
      document.getElementById('door').classList.add('leaving');
      setTimeout(function () { window.location.href = 'world.html'; }, 800);
    });
  </script>

</body>
</html>
