<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stephie's World</title>
  <meta name="description" content="The personal world of Stephie, between New York, London, Paris, and Shanghai.">
  <meta name="keywords" content="Stephie, writer, New York, tech, literary fiction">
  <meta property="og:title" content="Stephie's World">
  <meta property="og:description" content="A personal world.">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Stephie",
    "url": "https://stephiesworld.com",
    "jobTitle": "Writer & Technologist",
    "address": { "@type": "PostalAddress", "addressLocality": "New York" }
  }
  </script>
  <link rel="canonical" href="https://stephiesworld.com/">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&family=Tilt+Neon&family=Doto:wght@900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&text=上海&display=swap" rel="stylesheet">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="neon.css?v=20261001b">
  <style>
    :root { --cream-dim: rgba(239, 228, 214, 0.55); --cream-faint: rgba(239, 228, 214, 0.28); }
    #globe { position: fixed; inset: 0; z-index: 1; cursor: grab; }
    #globe:active { cursor: grabbing; }

    /* Globe fades up out of the dark */
    #globe { opacity: 0; transition: opacity 2.4s ease; }
    #globe.ready { opacity: 1; }

    /* ─── Corners ─── */
    .corner { position: fixed; z-index: 10; opacity: 0; animation: appear 1.4s ease forwards; }
    .tl { top: 2rem; left: 2.4rem; animation-delay: 0.6s; }
    .tr { top: 2.25rem; right: 2.4rem; animation-delay: 0.8s; }
    .bl { bottom: 2rem; left: 2.4rem; animation-delay: 1.2s; line-height: 2.1; }
    .br { bottom: 2rem; right: 2.4rem; animation-delay: 1.4s; text-align: right; line-height: 2.1; }

    .tagline { margin-top: 0.5rem; font-size: 0.55rem; }
    .nav { display: flex; gap: 1.6rem; align-items: center; }

    @media (prefers-reduced-motion: reduce) {
      .nav a.sign, .blade, .blade .bad { animation: none; }
    }

    .now-dot {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background: var(--neon); box-shadow: 0 0 8px var(--neon), 0 0 16px var(--neon-soft);
      margin-right: 0.6rem; vertical-align: 1px;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse { 50% { opacity: 0.35; } }

    .hint {
      position: fixed; z-index: 10; left: 50%; bottom: 2.1rem; transform: translateX(-50%);
      opacity: 0; animation: appear 1.4s ease 2.4s forwards;
      transition: opacity 1s ease;
      white-space: nowrap;
    }
    .hint.gone { opacity: 0 !important; animation: none; }


    /* ─── City pins (HTML overlays positioned by globe.gl) ─── */
    .pin { width: 0; height: 0; position: relative; pointer-events: auto; cursor: pointer; transition: opacity 0.5s ease; }

    .pin-dot {
      position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber); box-shadow: 0 0 6px var(--amber), 0 0 18px var(--amber-soft);
    }
    .pin.is-current .pin-dot {
      background: var(--neon); box-shadow: 0 0 8px var(--neon), 0 0 22px var(--neon-soft);
    }

    /* generous invisible hit area */
    .pin::before { content: ''; position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; }

    .pin-label {
      position: absolute; left: 12px; top: -9px;
      display: flex; align-items: baseline; gap: 0.45rem;
      white-space: nowrap;
      transition: transform 0.35s ease;
    }
    .pin-zh { font-family: var(--zh); font-size: 0.8rem; font-weight: 500; color: var(--amber); text-shadow: 0 0 10px var(--amber-soft); }
    .pin-en { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-dim); }
    /* Cities without a Chinese name: the English name becomes the lit sign */
    .pin-label .pin-en:first-child { font-size: 0.62rem; color: var(--amber); text-shadow: 0 0 10px var(--amber-soft); }
    .pin.is-current .pin-label .pin-en:first-child { color: var(--neon); text-shadow: 0 0 10px var(--neon-soft), 0 0 22px var(--neon-faint); }
    .pin.is-current .pin-zh { color: var(--neon); text-shadow: 0 0 10px var(--neon-soft), 0 0 22px var(--neon-faint); }
    .pin-here { font-family: var(--mono); font-size: 0.5rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neon); }

    .pin.label-below .pin-label { top: 4px; }
    .pin.label-above .pin-label { top: -22px; }
    .pin:hover .pin-label { transform: translateX(3px); }
    /* Near the right edge of the screen, a name hangs to the left of its dot instead of running off */
    .pin.flip .pin-label { left: auto; right: 12px; flex-direction: row-reverse; }
    .pin.flip:hover .pin-label { transform: translateX(-3px); }
    /* In daylight a city's light is turned down */
    .pin.is-day .pin-dot { filter: saturate(0.6) brightness(0.75); box-shadow: 0 0 4px var(--amber-soft); }
    .pin.is-day.is-current .pin-dot { box-shadow: 0 0 5px var(--neon-soft); }
    .pin.is-day .pin-label { opacity: 0.7; }
    .pin:hover .pin-en { color: var(--cream); }

    /* ─── City panel ─── */
    .panel {
      position: fixed; z-index: 20; top: 50%; right: 3rem;
      width: min(340px, calc(100vw - 2rem));
      transform: translate(24px, -50%); opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      display: grid; grid-template-columns: auto 1fr; gap: 1.4rem;
      padding: 2rem 1.8rem 1.8rem 1.4rem;
      background: linear-gradient(160deg, rgba(20, 8, 12, 0.72), rgba(5, 5, 7, 0.82));
      border: 1px solid var(--line);
      border-left: 1px solid var(--neon-soft);
      box-shadow: -8px 0 40px rgba(255, 45, 74, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .panel.open { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }

    .panel-zh {
      writing-mode: vertical-rl;
      font-family: var(--zh); font-weight: 500; font-size: 2rem; letter-spacing: 0.3em;
      color: var(--neon); text-shadow: 0 0 14px var(--neon-soft), 0 0 40px var(--neon-faint);
    }
    .panel-zh.amber { color: var(--amber); text-shadow: 0 0 14px var(--amber-soft); }

    .panel-name { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2rem; line-height: 1.1; color: var(--cream); }
    .panel-meta { margin-top: 0.7rem; line-height: 1.9; font-size: 0.55rem; }
    .panel-copy .places { display: block; margin-top: 0.7rem; font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-faint); }
    .panel-copy a { color: var(--cream); border-bottom: 1px solid var(--neon-soft); }
    .panel-copy { margin-top: 1.1rem; font-family: var(--serif); font-size: 1rem; line-height: 1.6; color: var(--cream-dim); }
    .panel-links { margin-top: 1.4rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .panel-links a { font-size: 0.6rem; color: var(--cream-dim); transition: color 0.3s ease, letter-spacing 0.3s ease; }
    .panel-links a:hover { color: var(--cream); letter-spacing: 0.22em; }
    .panel-links a.primary { color: var(--neon); text-shadow: 0 0 8px var(--neon-soft); }
    .panel-soon { font-size: 0.55rem; }

    .panel-close {
      position: absolute; top: 0.9rem; right: 1rem; background: none; border: none; cursor: pointer;
      font-family: var(--mono); font-size: 0.8rem; color: var(--cream-faint);
    }
    .panel-close:hover { color: var(--cream); }

    @media (max-width: 720px) {
      .tl { top: 1.4rem; left: 1rem; }
      .tr { top: 4.1rem; left: 1rem; right: auto; }
      .nav { gap: 1rem; }
      .bl { left: 1rem; bottom: 1.2rem; }
      .br, .hint { display: none; }
      .panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%;
        transform: translateY(24px);
        border-left: 1px solid var(--line); border-top: 1px solid var(--neon-soft);
        padding: 1.6rem 1.2rem 2rem;
      }
      .panel.open { transform: none; }
      .panel-zh { font-size: 1.5rem; }
    }

    /* Blade sign: a tall Hong Kong sign bolted to the right edge */
    .blade {
      position: fixed; z-index: 12; top: 24vh; right: 2.2rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
      padding: 1rem 0.75rem 0.9rem;
      background: linear-gradient(180deg, rgba(20, 8, 12, 0.92), rgba(8, 5, 8, 0.92));
      border: 1px solid rgba(239, 228, 214, 0.08); border-radius: 6px;
      box-shadow: 0 0 40px rgba(255, 45, 74, 0.18), 0 12px 30px rgba(0, 0, 0, 0.6);
      animation: sign-on 2.4s steps(1, end) 1.4s both;
    }
    .blade::before { content: ''; position: absolute; top: 1.2rem; right: -2.2rem; width: 2.2rem; height: 2px; background: rgba(239, 228, 214, 0.18); }
    .blade::after { content: ''; position: absolute; bottom: 1.2rem; right: -2.2rem; width: 2.2rem; height: 2px; background: rgba(239, 228, 214, 0.18); }
    .blade span {
      font-family: 'Tilt Neon', var(--mono); font-size: 1.9rem; line-height: 1.12; color: #ffe3e8;
      text-shadow: 0 0 2px #fff, 0 0 6px #ff5a78, 0 0 14px #ff2d4a, 0 0 30px #ff2d4a, 0 0 54px rgba(255, 45, 74, 0.55);
    }
    .blade .bad { animation: tube 9s steps(1, end) 5s infinite; }
    .blade .arrow { margin-top: 0.3rem; font-size: 1.1rem; color: #fff1dc; text-shadow: 0 0 2px #fff, 0 0 6px #ffc27a, 0 0 14px #ffb15c; }
    .blade:hover { filter: brightness(1.25); }
    @media (max-width: 720px) {
      .blade { top: 1.2rem; right: 1rem; padding: 0.6rem 0.45rem; }
      .blade span { font-size: 1.1rem; }
      .blade::before, .blade::after { right: -1rem; width: 1rem; }
    }
    .blade { transition: opacity 0.5s ease, transform 0.5s ease; }
    @media (min-width: 721px) {
      body.panel-open .blade { opacity: 0 !important; transform: translateX(30px); pointer-events: none; }
    }

    /* The name is the shop sign: warm amber block tubes */
    .corner.tl .brand {
      font-family: 'Tilt Neon', var(--mono); font-style: normal; text-transform: uppercase;
      font-size: 1.15rem; letter-spacing: 0.2em; color: #fff1dc;
      text-shadow: 0 0 2px #fff, 0 0 5px #ffc27a, 0 0 12px #ffb15c, 0 0 26px rgba(255, 177, 92, 0.55);
      animation: sign-on 2.2s steps(1, end) 0.4s both;
    }
    @media (max-width: 720px) { .corner.tl .brand { font-size: 0.95rem; } }

    /* City names are signs: small neon tubes, amber for my cities, pink for home */
    .pin-label .pin-en, .pin-label .pin-en:first-child {
      font-family: 'Tilt Neon', var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff1dc; text-shadow: 0 0 2px #fff, 0 0 5px #ffc27a, 0 0 11px #ffb15c, 0 0 22px rgba(255, 177, 92, 0.5);
    }
    .pin.is-current .pin-label .pin-en, .pin.is-current .pin-label .pin-en:first-child {
      color: #ffe3e8; text-shadow: 0 0 2px #fff, 0 0 5px #ff5a78, 0 0 12px #ff2d4a, 0 0 24px rgba(255, 45, 74, 0.55);
    }
    .pin-here { font-family: 'Tilt Neon', var(--mono); font-size: 0.6rem; color: #ffe3e8; text-shadow: 0 0 6px #ff2d4a; }
    .pin.is-day .pin-label { opacity: 0.55; }

    /* Live readouts are amber dot-matrix LED boards, like the red minibuses' destination signs */
    #status, #coords, #hint {
      font-family: 'Doto', var(--mono); font-weight: 900; font-size: 0.86rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: #ffb15c; text-shadow: 0 0 4px rgba(255, 177, 92, 0.8), 0 0 12px rgba(255, 177, 92, 0.35);
      padding: 0.45rem 0.8rem; line-height: 1.7;
      background: rgba(18, 9, 4, 0.72); border: 1px solid rgba(255, 177, 92, 0.16); border-radius: 3px;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.8);
    }
    #status b, #coords b { font-weight: 900; color: #ffd08a; }
    #status .now-dot { background: #ff5a3c; box-shadow: 0 0 6px #ff5a3c; }
    #hint { font-size: 0.72rem; }

    /* ─── Satellites: the builds, in orbit ─── */
    #sats { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .sat {
      position: absolute; left: 0; top: 0; width: 0; height: 0;
      pointer-events: auto; cursor: pointer; opacity: 0;
      transition: opacity 0.6s ease;
      --c: #fff; --c-soft: rgba(255, 255, 255, 0.5);
    }
    .sat.up { opacity: 1; }
    .sat.down { pointer-events: none; }
    .sat::before { content: ''; position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; }
    /* body: a small lit diamond with two thin solar-panel wings */
    .sat-body {
      position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; transform: rotate(45deg);
      background: var(--c); box-shadow: 0 0 6px var(--c), 0 0 16px var(--c-soft);
    }
    .sat-wing { position: absolute; top: -0.5px; width: 7px; height: 1px; background: var(--c-soft); }
    .sat-wing.l { left: -12px; } .sat-wing.r { left: 5px; }
    .sat-label {
      position: absolute; left: 16px; top: -10px; white-space: nowrap;
      display: flex; align-items: baseline; gap: 0.5rem;
      transition: transform 0.35s ease;
    }
    .sat-name {
      font-family: 'Tilt Neon', var(--mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: #fff; text-shadow: 0 0 2px #fff, 0 0 5px var(--c), 0 0 12px var(--c), 0 0 22px var(--c-soft);
    }
    .sat:hover .sat-label { transform: translateX(3px); }
    .sat.flip .sat-label { left: auto; right: 16px; flex-direction: row-reverse; }
    .sat.flip:hover .sat-label { transform: translateX(-3px); }
    .sat.henry   { --c: #7fb2ff; --c-soft: rgba(127, 178, 255, 0.5); }
    .sat.cherry  { --c: #ff5a78; --c-soft: rgba(255, 90, 120, 0.5); }
    .sat.stanley { --c: #6fcfc0; --c-soft: rgba(111, 207, 192, 0.5); }
    .sat.delphi  { --c: #8dffa0; --c-soft: rgba(141, 255, 160, 0.45); }
    /* Each build's symbol, drawn as a little neon tube */
    .sat-icon {
      width: 18px; height: 18px; align-self: center; flex: none;
      fill: none; stroke: var(--c); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 6px var(--c-soft));
    }
    .sat-icon .fill { fill: var(--c); stroke: none; }

    .panel-meta .sat-c { color: var(--sat-c, var(--cream)); text-shadow: 0 0 8px var(--sat-c, transparent); }

    /* On a phone the names would crowd the cities, so only the symbol rides along */
    @media (max-width: 720px) {
      .sat-name { display: none; }
      .sat-label { left: 12px; top: -10px; }
      .sat.flip .sat-label { right: 12px; }
    }
  </style>
</head>
<body>

  <h1 class="sr-only">Stephie</h1>

  <div id="globe" aria-label="Globe of the cities in Stephie's world"></div>

  <div id="sats" aria-label="Builds in orbit"></div>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <header class="corner tl">
    <p class="brand">Stephie's World</p>
  </header>

  <nav class="corner tr hud nav">
    <a href="about.html" class="sign teal">about</a>
    <a href="books.html" class="sign amber">reading</a>
  </nav>

  <div class="corner bl hud" id="status"></div>
  <div class="corner br hud" id="coords"></div>
  <p class="hint hud" id="hint">drag to turn &middot; touch a light</p>

  <a class="blade" href="work.html" aria-label="Work"><span>W</span><span>O</span><span class="bad">R</span><span>K</span><span class="arrow">&darr;</span></a>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="panel-close" id="panelClose" aria-label="Close">&times;</button>
    <div class="panel-zh" id="pZh"></div>
    <div>
      <h2 class="panel-name" id="pName"></h2>
      <p class="panel-meta hud" id="pMeta"></p>
      <p class="panel-copy" id="pCopy"></p>
      <div class="panel-links hud" id="pLinks"></div>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0"></script>
  <script src="rain.js"></script>
  <script>
    // ─── Home ───
    // The red pin marks home base. Deliberately no live location or travel dates:
    // anything here is readable in the page source.
    var HOME_CITY = 'newyork';

    var CITIES = {
      newyork: {
        name: 'New York', lat: 40.7128, lng: -74.006, tz: 'America/New_York',
        copy: 'Home for the past decade.<span class="places">Morgan Stanley &middot; Harry&rsquo;s &middot; Little Bun &middot; Amazon</span>',
        links: [
          { href: 'nyc.html#work', label: 'Career &rarr;', primary: true },
          { href: 'nyc.html#guide', label: 'City Guide &rarr;' }
        ]
      },
      london: {
        name: 'London', lat: 51.5074, lng: -0.1278, tz: 'Europe/London', label: 'above',
        copy: '',
        links: [{ href: 'london.html', label: 'Map &rarr;', primary: true }]
      },
      paris: {
        name: 'Paris', lat: 48.8566, lng: 2.3522, tz: 'Europe/Paris',
        copy: '',
        links: [{ href: 'paris.html', label: 'City Guide &rarr;', primary: true }]
      },
      shanghai: {
        name: 'Shanghai', zh: '上海', lat: 31.2304, lng: 121.4737, tz: 'Asia/Shanghai',
        tag: 'hometown',
        copy: '',
        links: [{ href: 'shanghai.html', label: 'Map &rarr;', primary: true }]
      },
      madrid: {
        name: 'Madrid', lat: 40.4168, lng: -3.7038, tz: 'Europe/Madrid', label: 'below',
        copy: 'Dinner at ten and the best sunlight on earth.',
        links: [{ href: 'madrid.html', label: 'Map &rarr;', primary: true }]
      },
      grindelwald: {
        name: 'Grindelwald', lat: 46.6242, lng: 8.0414, tz: 'Europe/Zurich', label: 'below',
        copy: '',
        links: [{ href: 'grindelwald.html', label: 'Map &rarr;', primary: true }]
      }
    };

    var HERE = CITIES[HOME_CITY];

    function localTime(tz) {
      return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(new Date());
    }


    function renderStatus() {
      document.getElementById('status').innerHTML =
        '<span class="now-dot"></span>home <b>' + HERE.name + '</b> &middot; ' + localTime(HERE.tz);
    }
    renderStatus();
    setInterval(renderStatus, 30000);

    // ─── Globe ───
    var el = document.getElementById('globe');
    var mobile = window.innerWidth < 720;
    var restAltitude = mobile ? 4.3 : 2.1;

    var points = Object.keys(CITIES).map(function (id) {
      var c = CITIES[id];
      return { id: id, lat: c.lat, lng: c.lng, city: c, current: c === HERE };
    });

    var world = Globe({ animateIn: false })(el)
      .width(window.innerWidth)
      .height(window.innerHeight)
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true)
      .atmosphereColor('#ff2d4a')
      .atmosphereAltitude(0.16)
      .showGraticules(true)
      .htmlElementsData(points)
      .htmlAltitude(0.01)
      .htmlElement(makePin)
      .ringsData([HERE])
      .ringLat('lat').ringLng('lng')
      .ringColor(function (d) { return d.lake ? function (t) { return 'rgba(255,177,92,' + (1 - t) * 0.9 + ')'; } : function (t) { return 'rgba(255,45,74,' + (1 - t) * 0.8 + ')'; }; })
      .ringMaxRadius(3.2)
      .ringPropagationSpeed(1.2)
      .ringRepeatPeriod(1600)
      .onGlobeClick(closePanel);

    if (world.htmlElementVisibilityModifier) {
      world.htmlElementVisibilityModifier(function (el, visible) {
        el.style.opacity = visible ? 1 : 0;
        el.style.pointerEvents = visible ? 'auto' : 'none';
      });
    }

    // Ink-dark sphere with a faint red rim
    var mat = world.globeMaterial();
    mat.color.set('#070506');
    mat.emissive && mat.emissive.set('#0c0205');
    mat.shininess = 8;

    // ─── The real sun ───
    // Where the sun is overhead right now (subsolar point), from a standard low-precision solar model.
    var RAD = Math.PI / 180;
    function subsolar(date) {
      var d = (date.getTime() - Date.UTC(2000, 0, 1, 12)) / 86400000;
      var g = (357.529 + 0.98560028 * d) * RAD;
      var q = 280.459 + 0.98564736 * d;
      var L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
      var e = (23.439 - 0.00000036 * d) * RAD;
      var dec = Math.asin(Math.sin(e) * Math.sin(L));
      var ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / RAD;
      var gmst = (18.697374558 + 24.06570982441908 * d) % 24;
      var lng = ((ra - gmst * 15) % 360 + 540) % 360 - 180;
      return { lat: dec / RAD, lng: lng };
    }
    function vec(lat, lng) {
      return [Math.cos(lat * RAD) * Math.cos(lng * RAD), Math.cos(lat * RAD) * Math.sin(lng * RAD), Math.sin(lat * RAD)];
    }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    var SUN = (function () { var s = subsolar(new Date()); return vec(s.lat, s.lng); })();
    function isNight(lat, lng) { return dot(SUN, vec(lat, lng)) < 0; }

    // The line where it's dusk or dawn right now: every point 90° from the sun
    function terminator() {
      var up = Math.abs(SUN[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
      var u = [SUN[1] * up[2] - SUN[2] * up[1], SUN[2] * up[0] - SUN[0] * up[2], SUN[0] * up[1] - SUN[1] * up[0]];
      var n = Math.hypot(u[0], u[1], u[2]); u = [u[0] / n, u[1] / n, u[2] / n];
      var v = [SUN[1] * u[2] - SUN[2] * u[1], SUN[2] * u[0] - SUN[0] * u[2], SUN[0] * u[1] - SUN[1] * u[0]];
      var paths = [], cur = [], prev = null;
      for (var i = 0; i <= 360; i += 2) {
        var t = i * RAD, c = Math.cos(t), sn = Math.sin(t);
        var p = [c * u[0] + sn * v[0], c * u[1] + sn * v[1], c * u[2] + sn * v[2]];
        var lat = Math.asin(p[2]) / RAD, lng = Math.atan2(p[1], p[0]) / RAD;
        if (prev !== null && Math.abs(lng - prev) > 180) { paths.push(cur); cur = []; }
        cur.push([lat, lng]); prev = lng;
      }
      paths.push(cur);
      return paths.map(function (pts) { return { points: pts }; });
    }


    // ─── Builds in orbit ───
    // Cities are where I've been; satellites are what I've launched from here.
    // Each orbit is a tilted circle (inclination, node) at its own height; period in seconds.
    var SATS = [
      { id: 'henry', name: 'Henry', rgb: '127,178,255', incl: 24, node: 10, alt: 0.3, period: 150, phase: 40,
        meta: 'Amazon 1P vendor ops', copy: 'Classifies chargebacks by root cause and drafts the dispute. Graded by evals.',
        links: [{ href: 'https://henry-ten.vercel.app', label: 'Live &#8599;', primary: true, ext: true }, { href: 'work.html#builds', label: 'On the work page &rarr;' }] },
      { id: 'cherry', name: 'Cherry', rgb: '255,90,120', incl: 58, node: 75, alt: 0.38, period: 190, phase: 160,
        meta: 'Voice-of-customer triage', copy: 'Finds feedback across the open web, clusters it into issues, and ranks them. Your corrections re-rank it.',
        links: [{ href: 'https://cherry-topaz.vercel.app', label: 'Live &#8599;', primary: true, ext: true }, { href: 'work.html#builds', label: 'On the work page &rarr;' }] },
      { id: 'stanley', name: 'Stanley', rgb: '111,207,192', incl: 112, node: 150, alt: 0.46, period: 230, phase: 280,
        meta: 'Calendar agent', copy: 'Reads the week and proposes one-line fixes over Telegram, by voice. Never writes to the calendar without a yes.',
        links: [{ href: 'https://stanley-butler.vercel.app', label: 'Live &#8599;', primary: true, ext: true }, { href: 'work.html#builds', label: 'On the work page &rarr;' }] },
      { id: 'delphi', name: 'Delphi', rgb: '141,255,160', incl: 40, node: 230, alt: 0.55, period: 270, phase: 100,
        meta: 'Stock stories', copy: 'The 100 most popular stocks on Robinhood, explained the way a CEO would explain them.',
        links: [{ href: 'https://delphi-stocks.vercel.app', label: 'Live &#8599;', primary: true, ext: true }] }
    ];

    // 24×24 line drawings: a cherry, Henry's toolbox, Stanley the bear, Delphi's candlesticks
    var ICONS = {
      henry: '<rect x="3" y="9" width="18" height="11" rx="1.5"/><path d="M9 9V6.5h6V9M3 13.5h18M11 12.5v2.5h2v-2.5"/>',
      cherry: '<circle cx="7" cy="17" r="3.6"/><circle cx="16.5" cy="18" r="3.6"/><path d="M7 13.4C8 9 10.5 5.5 14 3.5M16.5 14.4C16 10 15 6.5 14 3.5M14 3.5c2.5-1 5.5-.4 6.5 1.6-2.6.9-5 .4-6.5-1.6z"/>',
      stanley: '<circle cx="6" cy="6.5" r="2.6"/><circle cx="18" cy="6.5" r="2.6"/><circle cx="12" cy="13" r="7.5"/><ellipse cx="12" cy="16" rx="3" ry="2.2"/><circle class="fill" cx="9.2" cy="11.4" r="1"/><circle class="fill" cx="14.8" cy="11.4" r="1"/><circle class="fill" cx="12" cy="15.2" r="0.9"/>',
      delphi: '<path d="M5 4v16M12 2.5v19M19 6v13"/><rect x="3.5" y="10" width="3" height="6" rx=".5"/><rect x="10.5" y="5.5" width="3" height="9" rx=".5"/><rect x="17.5" y="8" width="3" height="7" rx=".5"/>'
    };

    function orbitPoint(s, deg) {
      var i = s.incl * RAD, o = s.node * RAD, t = deg * RAD;
      var u = [Math.cos(o), Math.sin(o), 0];
      var v = [-Math.sin(o) * Math.cos(i), Math.cos(o) * Math.cos(i), Math.sin(i)];
      var p = [Math.cos(t) * u[0] + Math.sin(t) * v[0], Math.cos(t) * u[1] + Math.sin(t) * v[1], Math.cos(t) * u[2] + Math.sin(t) * v[2]];
      return [Math.asin(p[2]) / RAD, Math.atan2(p[1], p[0]) / RAD];
    }
    var ORBIT_PATHS = SATS.map(function (s) {
      var pts = [];
      for (var d = 0; d <= 360; d += 3) { var q = orbitPoint(s, d); pts.push([q[0], q[1], s.alt]); }
      return { points: pts, color: 'rgba(' + s.rgb + ',0.42)', stroke: 0.6, dash: 1, gap: 0 };
    });

    // Countries that hold one of my cities burn a little warmer
    var MINE = ['United States of America', 'United Kingdom', 'France', 'Spain', 'China', 'Switzerland'];

    // Land as a field of dim dots, like a city seen from a plane at night
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
      .then(function (r) { return r.json(); })
      .then(function (topo) {
        var land = topojson.feature(topo, topo.objects.countries).features
          .filter(function (f) { return f.properties.name !== 'Antarctica'; });
        land.forEach(function (f) { f.__v = centre(f); });
        world
          .hexPolygonsData(land)
          .hexPolygonResolution(3)
          .hexPolygonMargin(0.55)
          .hexPolygonUseDots(true)
          .hexPolygonAltitude(0.002)
          .hexPolygonColor(landColor);
        paintSky();
      })
      .finally(function () { el.classList.add('ready'); });

    // A country's rough middle, as a direction from the globe's centre
    function centre(f) {
      var sum = [0, 0, 0];
      (function walk(c) {
        if (typeof c[0] === 'number') { var w = vec(c[1], c[0]); sum[0] += w[0]; sum[1] += w[1]; sum[2] += w[2]; }
        else c.forEach(walk);
      })(f.geometry.coordinates);
      var n = Math.hypot(sum[0], sum[1], sum[2]) || 1;
      return [sum[0] / n, sum[1] / n, sum[2] / n];
    }
    function landColor(f) {
      var night = Math.min(1, Math.max(0, (0.12 - dot(SUN, f.__v)) / 0.24));
      var mine = MINE.indexOf(f.properties.name) > -1;
      var a = mine ? 0.3 + 0.35 * night : 0.2 + 0.24 * night;
      return mine ? 'rgba(255,177,92,' + a.toFixed(3) + ')' : 'rgba(255,60,85,' + a.toFixed(3) + ')';
    }
    function paintSky() {
      var sun = subsolar(new Date());
      SUN = vec(sun.lat, sun.lng);
      world.hexPolygonColor(function (f) { return landColor(f); });
      world.pathsData(terminator().concat(ORBIT_PATHS));
      document.querySelectorAll('.pin').forEach(function (pin) {
        var c = CITIES[pin.dataset.id];
        if (c) pin.classList.toggle('is-day', !isNight(c.lat, c.lng));
      });
    }
    world
      .pathPoints('points')
      .pathPointLat(function (p) { return p[0]; })
      .pathPointLng(function (p) { return p[1]; })
      .pathPointAlt(function (p) { return p[2] != null ? p[2] : 0.004; })
      .pathColor(function (d) { return d.color || 'rgba(255,177,92,0.7)'; })
      .pathStroke(function (d) { return d.stroke || 0.9; })
      .pathDashLength(function (d) { return d.dash != null ? d.dash : 0.02; })
      .pathDashGap(function (d) { return d.gap != null ? d.gap : 0.015; })
      .pathTransitionDuration(0);
    paintSky();
    setInterval(paintSky, 5 * 60 * 1000);

    world.pointOfView({ lat: HERE.lat - 8, lng: HERE.lng - 25, altitude: restAltitude }, 0);

    var controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.28;
    controls.enableZoom = true;
    controls.minDistance = 160;
    controls.maxDistance = 900;
    controls.enableDamping = true;

    var resumeTimer;
    function pauseSpin(ms) {
      controls.autoRotate = false;
      clearTimeout(resumeTimer);
      if (ms) resumeTimer = setTimeout(function () { controls.autoRotate = true; }, ms);
    }
    el.addEventListener('pointerdown', function () {
      pauseSpin(8000);
      document.getElementById('hint').classList.add('gone');
    });

    // Live coordinates of whatever is facing you
    var coordsEl = document.getElementById('coords');
    function fmt(v, pos, neg) { return Math.abs(v).toFixed(2) + '&deg;' + (v >= 0 ? pos : neg); }
    function renderCoords(pov) {
      pov = pov || world.pointOfView();
      var lng = ((pov.lng + 540) % 360) - 180;
      coordsEl.innerHTML = fmt(pov.lat, 'N', 'S') + ' &nbsp;' + fmt(lng, 'E', 'W');
    }
    world.onZoom(renderCoords);
    renderCoords();

    function makePin(d) {
      var pin = document.createElement('div');
      pin.className = 'pin' + (d.current ? ' is-current' : '') + (d.city.label ? ' label-' + d.city.label : '') +
        (isNight(d.lat, d.lng) ? '' : ' is-day');
      pin.dataset.id = d.id;
      pin.innerHTML =
        '<span class="pin-dot"></span>' +
        '<span class="pin-label">' + (d.city.zh ? '<span class="pin-zh">' + d.city.zh + '</span>' : '') +
        '<span class="pin-en">' + d.city.name + '</span>' +
        (d.current ? '<span class="pin-here">&middot; home</span>' : '') + '</span>';
      // Keep the orbit controls from capturing the pointer, or the click never lands
      pin.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      pin.addEventListener('click', function (e) { e.stopPropagation(); openCity(d.id); });
      return pin;
    }

    // Flip a city's name to the left of its dot when it would run off the right edge
    (function keepLabelsOnScreen() {
      document.querySelectorAll('.pin').forEach(function (pin) {
        var label = pin.querySelector('.pin-label');
        if (!label) return;
        var w = label.offsetWidth, x = pin.getBoundingClientRect().left;
        pin.classList.toggle('flip', x + 12 + w > window.innerWidth - 10);
      });
      setTimeout(function () { requestAnimationFrame(keepLabelsOnScreen); }, 200);
    })();

    // ─── Panel ───
    var panel = document.getElementById('panel');

    function openCity(id) {
      var c = CITIES[id];
      pauseSpin(0);
      document.getElementById('hint').classList.add('gone');
      // Nudge the camera so the city sits left of the panel on desktop
      world.pointOfView({ lat: c.lat - (mobile ? 12 : 0), lng: c.lng + (mobile ? 0 : 22), altitude: mobile ? 3 : 1.35 }, 1600);

      var status = c === HERE ? '<span class="red">home</span>' : (c.tag || '');
      document.getElementById('pZh').textContent = c.zh || '';
      document.getElementById('pZh').style.display = c.zh ? '' : 'none';
      panel.style.gridTemplateColumns = c.zh ? '' : '1fr';
      document.getElementById('pZh').className = 'panel-zh' + (c === HERE ? '' : ' amber');
      document.getElementById('pName').textContent = c.name;
      document.getElementById('pMeta').innerHTML =
        fmt(c.lat, 'N', 'S') + ' ' + fmt(c.lng, 'E', 'W') + '<br>' +
        'local ' + localTime(c.tz) + ' &middot; ' + (isNight(c.lat, c.lng) ? 'night' : 'day') + (status ? ' &middot; ' + status : '');
      document.getElementById('pCopy').innerHTML = c.copy;
      document.getElementById('pCopy').style.display = c.copy ? '' : 'none';
      document.getElementById('pLinks').innerHTML =
        c.links.map(function (l) {
          return '<a href="' + l.href + '"' + (l.primary ? ' class="primary"' : '') + '>' + l.label + '</a>';
        }).join('') + (c.soon ? '<span class="panel-soon">' + c.soon + '</span>' : '');
      panel.classList.add('open');
      document.body.classList.add('panel-open');
    }

    function closePanel() {
      if (!panel.classList.contains('open')) return;
      panel.classList.remove('open');
      satsHeld = false;
      document.body.classList.remove('panel-open');
      var pov = world.pointOfView();
      world.pointOfView({ lat: pov.lat, lng: pov.lng, altitude: restAltitude }, 1400);
      pauseSpin(1600);
    }


    // ─── Satellites ───
    // Plain DOM signs placed each frame at their orbit's screen position, hidden when the globe is in the way.
    var satLayer = document.getElementById('sats');
    var stillMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    SATS.forEach(function (s) {
      var n = document.createElement('div');
      n.className = 'sat ' + s.id;
      n.setAttribute('role', 'button');
      n.setAttribute('aria-label', s.name);
      n.innerHTML = '<span class="sat-wing l"></span><span class="sat-body"></span><span class="sat-wing r"></span>' +
        '<span class="sat-label"><svg class="sat-icon" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[s.id] + '</svg>' +
        '<span class="sat-name">' + s.name + '</span></span>';
      n.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      n.addEventListener('click', function (e) { e.stopPropagation(); openSat(s); });
      satLayer.appendChild(n);
      s.el = n;
      s.angle = s.phase;
    });

    var satsHeld = false, lastT = performance.now();
    (function flySats(t) {
      var dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
      var cam = world.camera().position, R = world.getGlobeRadius();
      SATS.forEach(function (s) {
        if (!satsHeld && !stillMotion) s.angle = (s.angle + dt * 360 / s.period) % 360;
        var q = orbitPoint(s, s.angle);
        var p = world.getCoords(q[0], q[1], s.alt);
        // Is the globe between the camera and the satellite?
        var d = [p.x - cam.x, p.y - cam.y, p.z - cam.z];
        var k = -(cam.x * d[0] + cam.y * d[1] + cam.z * d[2]) / (d[0] * d[0] + d[1] * d[1] + d[2] * d[2]);
        var hidden = false;
        if (k > 0 && k < 1) {
          var c = [cam.x + k * d[0], cam.y + k * d[1], cam.z + k * d[2]];
          hidden = Math.hypot(c[0], c[1], c[2]) < R;
        }
        var sc = world.getScreenCoords(q[0], q[1], s.alt);
        s.el.style.transform = 'translate(' + sc.x.toFixed(1) + 'px,' + sc.y.toFixed(1) + 'px)';
        s.el.classList.toggle('up', !hidden);
        s.el.classList.toggle('down', hidden);
        s.el.classList.toggle('flip', sc.x + 120 > window.innerWidth);
      });
      requestAnimationFrame(flySats);
    })(lastT);

    function openSat(s) {
      pauseSpin(0);
      satsHeld = true;
      document.getElementById('hint').classList.add('gone');
      document.getElementById('pZh').style.display = 'none';
      panel.style.gridTemplateColumns = '1fr';
      document.getElementById('pName').textContent = s.name;
      var meta = document.getElementById('pMeta');
      meta.style.setProperty('--sat-c', 'rgb(' + s.rgb + ')');
      meta.innerHTML = '<span class="sat-c">' + 'in orbit' + '</span> &middot; alt ' +
        Math.round(s.alt * 6371).toLocaleString('en-US') + ' km<br>' + s.meta;
      document.getElementById('pCopy').innerHTML = s.copy;
      document.getElementById('pCopy').style.display = '';
      document.getElementById('pLinks').innerHTML =
        s.links.map(function (l) {
          return '<a href="' + l.href + '"' + (l.primary ? ' class="primary"' : '') + (l.ext ? ' target="_blank" rel="noopener"' : '') + '>' + l.label + '</a>';
        }).join('');
      panel.classList.add('open');
      document.body.classList.add('panel-open');
    }

    document.getElementById('panelClose').addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

    // The secret (see secret.js): type 29 and the globe turns to where the book began
    window.__twentyNine = function () {
      openCity('grindelwald');
      document.getElementById('pCopy').innerHTML = 'where 29 began';
      document.getElementById('pCopy').style.display = '';
      world.ringsData([HERE, { lat: 46.6696, lng: 8.0210, lake: true }]);
    };
    if (location.hash === '#29') setTimeout(window.__twentyNine, 2200);

    window.addEventListener('resize', function () {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    startRain(document.getElementById('rain'), 0.8);

    // The hint fades once you've found your footing
    setTimeout(function () { document.getElementById('hint').classList.add('gone'); }, 9000);
  </script>

  <script src="secret.js"></script>
</body>
