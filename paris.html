<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paris — Stephie's World</title>
  <meta name="description" content="Stephie's personal guide to Paris.">
  <link rel="canonical" href="https://stephiesworld.com/paris.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&text=%E5%B7%B4%E9%BB%8E&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="neon.css">
  <link rel="stylesheet" href="citymap.css">
</head>
<body>

  <div id="map" aria-label="Map of Stephie's Paris"></div>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="index.html" class="hud nav">&larr; world</a>
    <nav class="hud nav">
      <a href="about.html">about</a>
      <a href="work.html">work</a>
      <a href="books.html">reading</a>
    </nav>
  </div>

  <aside class="index">
    <div class="title"><h1>Paris</h1><span class="zh flicker">巴黎</span></div>
    <p class="subtitle hud">a personal guide</p>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list" style="margin-top: 2rem"></div>
  </aside>

  <p class="foot hud">48.86&deg;N 2.35&deg;E &middot; <span id="clock"></span> paris</p>

  <article class="card" id="card" aria-live="polite">
    <button class="card-close" id="cardClose" aria-label="Close">&times;</button>
    <p class="card-kicker hud" id="cKicker"></p>
    <h2 class="card-name" id="cName"></h2>
    <p class="card-role hud" id="cRole"></p>
    <p class="card-addr hud" id="cAddr"></p>
    <p class="card-copy" id="cCopy"></p>
    <ul class="card-did" id="cDid"></ul>
    <p class="card-tags-label hud" id="cTagsLabel"></p>
    <div class="tags" id="cTags"></div>
    <div class="card-links hud" id="cLinks"></div>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="rain.js"></script>
  <script src="citymap.js"></script>
  <script>
    cityMap({
      tz: 'Europe/Paris',
      bearing: -12,
      home: { center: [2.300, 48.858], zoom: 12.3, pitch: 50 },
      bounds: [[2.05, 48.72], [2.6, 48.98]],

      groups: [
        { id: 'guide', label: 'guide', labels: 'hover', compact: true }
      ],

      places: [
        { id: 'burningbar', group: 'guide', category: 'fitness', name: 'Burning Bar', address: '42 Avenue Raymond Poincar&eacute; &middot; 16th arr.', lngLat: [2.28597, 48.86642],
          copy: 'Hot pilates, afrohouse music, mood lighting, French-speaking instructors. My favorite workout class in the entire world. I don&rsquo;t say that lightly.' },
        { id: 'rodin', group: 'guide', category: 'museums', name: 'Mus&eacute;e Rodin', address: '77 Rue de Varenne &middot; 7th arr.', lngLat: [2.3158, 48.8551],
          copy: 'One of the most peaceful museums in Paris, with a garden that does most of the heavy lifting. Plan to stay longer than you think.' },
        { id: 'flv', group: 'guide', category: 'museums', name: 'Fondation Louis Vuitton', address: '8 Avenue du Mahatma Gandhi &middot; Bois de Boulogne', lngLat: [2.2634, 48.8767],
          copy: 'My favorite art museum I&rsquo;ve ever visited. They only show one exhibit at a time, and each level traces the arc of the artist&rsquo;s life &mdash; the inspirations, the catalysts, the turning points. You leave knowing why they made it.' },
        { id: 'ptitcurieux', group: 'guide', category: 'restaurants', name: 'Au P&rsquo;tit Curieux', address: '27 Rue de Sambre-et-Meuse &middot; 10th arr.', lngLat: [2.3727, 48.8747],
          copy: 'My best friend and I have had multiple four-hour dinners here &mdash; sometimes twice in the same trip. The owner is funny and charming. One of those places you come back to every visit without even deciding to.' },
        { id: 'cojean', group: 'guide', category: 'restaurants', name: 'Cojean', address: '28 Rue du Bac &middot; 7th arr.', lngLat: [2.3268, 48.8558],
          copy: 'Healthy bowls clearly marked with protein content. If I lived in Paris full time, this would be my daily fast casual. Multiple locations across the city.' },
        { id: 'luxembourg', group: 'guide', category: 'parks', name: 'Jardin du Luxembourg', address: '6th arr.', lngLat: [2.3372, 48.8469],
          copy: 'The most beautiful park in the world, and I will stand by that. Tennis courts you can reserve in advance, which is just unfair to every other park in existence.' },
        { id: 'citypharma', group: 'guide', category: 'shopping', name: 'Citypharma', address: '26 Rue du Four &middot; 6th arr.', lngLat: [2.3337, 48.8530],
          copy: 'The French pharmacy experience is non-negotiable. Go in without a list, leave with fifteen things you didn&rsquo;t know you needed. I&rsquo;ve spent more money here than I&rsquo;ll admit.' },
        { id: 'fromfuture', group: 'guide', category: 'shopping', name: 'From Future', address: 'Le Marais &middot; multiple locations', lngLat: [2.3567, 48.8606],
          copy: 'My favorite sweater shop in the world (do you see the theme?). Delightful, colorful cashmere in the most charming little store. You will leave with something and wear it all winter.' },
        { id: 'rolandgarros', group: 'guide', category: 'tennis', name: 'Roland-Garros', address: '2 Avenue Gordon Bennett &middot; 16th arr.', note: 'late May &ndash; early June', lngLat: [2.2492, 48.8476],
          copy: 'Iconic, beautiful, peaceful, and so, so clean. The red clay is legendary and the battles here are hard fought and won. Easy to get in and out from the center of Paris.' },
        { id: 'ruedubac', group: 'guide', category: 'explore', name: 'Rue du Bac', address: '7th arr.', lngLat: [2.3238, 48.8510],
          copy: 'Walk the whole thing, all the way from the Seine to Bon March&eacute; department store. One of the most charming streets in Paris &mdash; great shops, a good energy, and my first Paris address was number 52.' },
        { id: 'saintgermain', group: 'guide', category: 'explore', name: 'Saint-Germain-des-Pr&eacute;s', address: '6th arr.', lngLat: [2.3336, 48.8540],
          copy: 'My favorite arrondissement. The area around the main square has everything &mdash; little restaurants, famous shops, people hanging out. Just walk around.' },
        { id: 'seine', group: 'guide', category: 'explore', name: 'The Seine at Sunset', address: 'Les Berges de la Seine', lngLat: [2.3374, 48.8583],
          copy: 'You have to go for a run here during sunset. One of the best running routes in the world &mdash; and yes, I am completely biased about this city.' }
      ]
    });

    startRain(document.getElementById('rain'), 0.6);
  </script>

</body>
</html>
