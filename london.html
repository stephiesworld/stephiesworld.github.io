<body>

  <div class="top">

  <p class="foot hud">51.51&deg;N 0.13&deg;W &middot; <span id="clock"></span> london</p>

  </article>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="rain.js?v=20261008"></script>
  <script src="citymap.js?v=20261008"></script>
  <script>
    cityMap({
      tz: 'Europe/London',
      bearing: 0,
      home: { center: [-0.160, 51.508], zoom: 12.2, pitch: 50 },
      bounds: [[-0.45, 51.35], [0.15, 51.68]],

      groups: [
        { id: 'guide', label: 'guide', labels: 'always', compact: true }
      ],

      places: [
        { id: 'watchhouse', group: 'guide', category: 'coffee', name: 'WatchHouse', address: '32&ndash;34 New Cavendish Street &middot; Marylebone', lngLat: [-0.1503, 51.5187],
          copy: 'The London original of the New York one. Good coffee on a quiet Marylebone street.' },
        { id: 'therug', group: 'guide', category: 'coffee', name: 'The Rug', address: '309&ndash;311 Harrow Road &middot; Maida Hill', lngLat: [-0.1979, 51.5232] },
        { id: 'chinatownbakery', group: 'guide', category: 'food', name: 'Chinatown Bakery', address: '86 Queensway &middot; Bayswater', lngLat: [-0.1875, 51.5132],
          copy: 'Hong Kong&ndash;style buns and egg tarts, for very little.' },
        { id: 'bunhouse', group: 'guide', category: 'food', name: 'Bun House', address: '26&ndash;27 Lisle Street &middot; Chinatown', lngLat: [-0.1299, 51.5118],
          copy: 'Cantonese steamed buns on a Chinatown side street.' },
        { id: 'dintaifung', group: 'guide', category: 'food', name: 'Din Tai Fung', address: '5&ndash;6 Henrietta Street &middot; Covent Garden', lngLat: [-0.1229, 51.5112],
          copy: 'Soup dumplings, folded in a kitchen you can watch from the street.' },
        { id: 'daunt', group: 'guide', category: 'bookshops', name: 'Daunt Books', address: '83 Marylebone High Street', lngLat: [-0.1523, 51.5204],
          copy: 'An Edwardian shop with long oak galleries, and travel books shelved by country.' },
        { id: 'huntersmoon', group: 'guide', category: 'pubs', name: 'The Hunter&rsquo;s Moon', address: '86 Fulham Road &middot; South Kensington', lngLat: [-0.1749, 51.4901] },
        { id: 'marylebone', group: 'guide', category: 'neighbourhoods', name: 'Marylebone', address: 'Marylebone High Street', lngLat: [-0.1512, 51.5226], zoom: 14.8,
          copy: 'Walk the High Street. Small shops and caf&eacute;s, and it feels like a village in the middle of London.' },
        { id: 'hydepark', group: 'guide', category: 'hyde park', name: 'Hyde Park', address: 'the Serpentine', lngLat: [-0.1653, 51.5059], zoom: 14,
          copy: 'Run the loop around the Serpentine.' },
        { id: 'swans', group: 'guide', category: 'hyde park', name: 'The swans', address: 'on the Serpentine', lngLat: [-0.1718, 51.5049], zoom: 14.6 }
      ]
    });

    window.sky = startRain(document.getElementById('rain'), 0);
  </script>
