<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" role="img" aria-label="Jev sorts every message and hands off only what needs more" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="currentColor">Jev sorts every message and hands off only what needs more</text>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M200 190H240" marker-end="url(#a)"/>
    <path d="M420 190H450V110H500" marker-end="url(#a)"/>
    <path d="M420 190H500" marker-end="url(#a)"/>
    <path d="M450 190V270H500" marker-end="url(#a)"/>
  </g>
  <rect x="20" y="162" width="180" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="110" y="186" text-anchor="middle" font-weight="600" fill="currentColor">Incoming text</text>
  <text x="110" y="204" text-anchor="middle" font-size="11.5" fill="#8a8a8a">ticket, email, or form</text>
  <rect x="240" y="162" width="180" height="56" rx="8" fill="#5b6ee1" fill-opacity="0.12" stroke="#5b6ee1" stroke-width="2"/>
  <text x="330" y="186" text-anchor="middle" font-weight="600" fill="currentColor">Jev answers the form</text>
  <text x="330" y="204" text-anchor="middle" font-size="11.5" fill="#8a8a8a">each answer with a confidence</text>
  <rect x="500" y="82" width="232" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="616" y="106" text-anchor="middle" font-weight="600" fill="currentColor">Act automatically</text>
  <text x="616" y="124" text-anchor="middle" font-size="11.5" fill="#8a8a8a">confident: route, tag, or approve</text>
  <rect x="500" y="162" width="232" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="616" y="186" text-anchor="middle" font-weight="600" fill="currentColor">LLM writes the reply</text>
  <text x="616" y="204" text-anchor="middle" font-size="11.5" fill="#8a8a8a">only when words are needed</text>
  <rect x="500" y="242" width="232" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="616" y="266" text-anchor="middle" font-weight="600" fill="currentColor">Person reviews</text>
  <text x="616" y="284" text-anchor="middle" font-size="11.5" fill="#8a8a8a">only when Jev is unsure</text>
</svg>
