<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Stephie's World</title>
  <meta name="description" content="I'm Stephie. I grew up between Shanghai and Texas and live in New York City.">
  <meta name="keywords" content="Stephie, writer, New York, AI, literary fiction, Studio Felix">
  <meta property="og:title" content="About — Stephie's World">
  <meta property="og:description" content="I'm Stephie.">
  <link rel="canonical" href="https://stephiesworld.com/about.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="neon.css">
  <style>
    body { overflow-y: auto; overflow-x: hidden; }
    .fx-rain { position: fixed; }

    .top {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.8rem 2.4rem 1.2rem;
      background: linear-gradient(to bottom, rgba(5, 5, 7, 0.95), transparent);
    }
    .top .nav { display: flex; gap: 1.6rem; }

    .page {
      position: relative; z-index: 3;
      max-width: 980px; margin: 0 auto; padding: 9rem 2.4rem 4rem;
      display: grid; grid-template-columns: 200px 1fr; gap: 4rem;
    }

    /* ─── Sticky index ─── */
    .toc { position: sticky; top: 9rem; align-self: start; opacity: 0; animation: appear 1.2s ease 0.3s forwards; }
    .toc .brand { font-size: 1.3rem; }
    .toc .tagline { margin-top: 0.5rem; font-size: 0.52rem; }
    .toc ol { list-style: none; margin-top: 2.4rem; }
    .toc a {
      display: flex; gap: 0.8rem; align-items: baseline; padding: 0.35rem 0;
      font-size: 0.58rem; color: var(--cream-faint); transition: color 0.3s ease;
    }
    .toc a:hover, .toc a.on { color: var(--cream); }

    /* ─── Sections ─── */
    section { padding-bottom: 5rem; scroll-margin-top: 8rem; opacity: 0; animation: appear 1.2s ease forwards; }
    section:nth-of-type(1) { animation-delay: 0.5s; }
    section:nth-of-type(2) { animation-delay: 0.65s; }
    section:nth-of-type(n+3) { animation-delay: 0.8s; }

    .sec-head { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.8rem; }
    .sec-head .num { font-size: 0.55rem; color: var(--neon); text-shadow: 0 0 8px var(--neon-soft); }
    .sec-head h2 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.9rem; color: var(--cream); }
    .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line); align-self: center; }

    .prose p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.75; color: var(--cream-dim); max-width: 36em; }
    .prose p + p { margin-top: 1.1rem; }
    .prose em { color: var(--cream); }
    .prose a { color: var(--cream); border-bottom: 1px solid var(--neon-soft); transition: border-color 0.3s ease, text-shadow 0.3s ease; }
    .prose a:hover { border-color: var(--neon); text-shadow: 0 0 10px var(--neon-faint); }

    .more { display: inline-block; margin-top: 1.4rem; font-size: 0.58rem; color: var(--neon); text-shadow: 0 0 8px var(--neon-soft); transition: letter-spacing 0.3s ease; }
    .more:hover { letter-spacing: 0.22em; }

    /* Projects */
    .proj { padding: 1.4rem 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1.5rem; }
    .proj:last-child { border-bottom: 1px solid var(--line); }
    .proj h3 { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; color: var(--cream); }
    .proj .yr { font-size: 0.55rem; align-self: baseline; }
    .proj .status { grid-column: 1 / -1; font-size: 0.52rem; color: var(--neon); }
    .proj p { grid-column: 1 / -1; font-family: var(--serif); font-size: 1.05rem; line-height: 1.7; color: var(--cream-dim); max-width: 36em; margin-top: 0.3rem; }


    .facts { margin-top: 1.6rem; display: grid; gap: 1rem; border-top: 1px solid var(--line); padding-top: 1.2rem; }
    .facts dt { font-size: 0.52rem; color: var(--neon); }
    .facts dd { margin-top: 0.35rem; font-size: 0.6rem; line-height: 1.8; color: var(--cream-dim); }

    @media (max-width: 760px) {
      .top { padding: 1.2rem 1rem 1rem; }
      .top .nav { gap: 1rem; }
      .page { grid-template-columns: 1fr; gap: 0; padding: 6rem 1rem 2rem; }
      .toc { position: static; margin-bottom: 3rem; }
      .toc ol { display: none; }
      .sec-head h2 { font-size: 1.6rem; }
      .prose p { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="index.html" class="hud nav">&larr; world</a>
    <nav class="hud nav">
      <a href="work.html">work</a>
      <a href="books.html">reading</a>
    </nav>
  </div>

  <div class="page">

    <aside class="toc">
      <h1 class="brand">Stephie</h1>
    </aside>

    <main>

      <section id="about">
        <div class="sec-head"><h2>About</h2></div>
        <div class="prose">
          <p>I&rsquo;m Stephie. I grew up between Shanghai and Texas, currently live in New York City, and am usually in Claude coding something.</p>
        </div>
        <a class="more hud" href="work.html">index of work &rarr;</a>
      </section>





    </main>
  </div>

  <script src="rain.js"></script>
  <script>
    startRain(document.getElementById('rain'), 0.5);

    // Light up the section you're reading
    var links = document.querySelectorAll('#toc a');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id); });
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('section[id]').forEach(function (s) { io.observe(s); });
  </script>

</body>
</html>
