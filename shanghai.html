<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shanghai — Stephie's World</title>
  <meta name="description" content="Stephie's Shanghai.">
  <link rel="canonical" href="https://stephiesworld.com/shanghai.html">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&text=上海&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="neon.css">
  <link rel="stylesheet" href="citymap.css">
</head>
<body>

  <div id="map" aria-label="Map of Stephie's Shanghai"></div>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="index.html" class="home-link">Stephie&rsquo;s World</a>
    <nav class="signs" aria-label="Site">
      <a href="about.html" class="sign teal">about</a>
      <a href="books.html" class="sign amber">reading</a>
      <a href="work.html" class="sign pink framed">work &rarr;</a>
    </nav>
  </div>

  <aside class="index">
    <div class="title"><h1>Shanghai</h1><span class="zh tube">上海</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list" style="margin-top: 2rem"></div>
  </aside>

  <p class="foot hud">31.23&deg;N 121.47&deg;E &middot; <span id="clock"></span> shanghai</p>

  <article class="card" id="card" aria-live="polite">
    <button class="card-close" id="cardClose" aria-label="Close">&times;</button>
    <p class="card-kicker hud" id="cKicker"></p>
    <h2 class="card-name" id="cName"></h2>
    <p class="card-role hud" id="cRole"></p>
    <p class="card-addr hud" id="cAddr"></p>
    <p class="card-copy" id="cCopy"></p>
    <ul class="card-did" id="cDid"></ul>
    <p class="card-tags-label hud" id="cTagsLabel"></p>
    <div class="tags" id="cTags"></div>
    <div class="card-links hud" id="cLinks"></div>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="rain.js"></script>
  <script src="citymap.js"></script>
  <script>
    cityMap({
      tz: 'Asia/Shanghai',
      bearing: 0,
      home: { center: [121.446, 31.219], zoom: 13, pitch: 50 },
      bounds: [[121.2, 31.0], [121.75, 31.45]],

      groups: [
        { id: 'guide', label: 'guide', labels: 'always', compact: true }
      ],

      places: [
        { id: 'grewup', group: 'guide', category: 'growing up', name: 'Where I grew up', address: 'Xinzha Road &amp; Yanping Road &middot; Jing&rsquo;an', lngLat: [121.4378, 31.2291], zoom: 15 },
        { id: 'jingan', group: 'guide', category: 'explore', name: 'Jing&rsquo;an Temple', address: '1686 West Nanjing Road &middot; Jing&rsquo;an', lngLat: [121.4408, 31.2252] },
        { id: 'frenchconcession', group: 'guide', category: 'explore', name: 'French Concession', address: 'Wukang Road &middot; Xuhui', lngLat: [121.4362, 31.2139], zoom: 14.5 }
      ]
    });

    window.sky = startRain(document.getElementById('rain'), 0);
  </script>

  <script src="secret.js"></script>
</body>
</html>
