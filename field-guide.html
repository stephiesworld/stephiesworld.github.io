<html lang="en">

<meta charset="utf-8">

<link rel="canonical" href="https://stephiesworld.com/field-guide.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="console.css">
</head>
<body>
<div style="min-height:100%;background:#0a0b09;background-image:radial-gradient(#181a14 1px,transparent 1px);background-size:22px 22px;padding:44px 24px 70px;box-sizing:border-box;">
  <div style="max-width:1040px;margin:0 auto;background:#0f110d;border:1px solid #2c3025;overflow:hidden;color:#e6ecd7;box-shadow:0 24px 60px -30px #000;">

    <!-- persistent nav -->
    <div style="display:flex;flex-wrap:wrap;border-bottom:1px solid #2c3025;font-family:'IBM Plex Mono',monospace;align-items:stretch;">
      <a class="h-nav" href="index.html" style="padding:11px 16px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.02em;border-right:1px solid #2c3025;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .12s,color .12s;">❦ STEPHIE'S WORLD</a>
      <a class="h-nav" href="about.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">01 ABOUT</a>
      <a class="h-nav" href="reading.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">02 READING</a>
      <a href="cities.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;color:#0f110d;background:#a7d17e;display:flex;align-items:center;">03 CITIES</a>
      <a class="h-nav" href="work.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">04 WORK</a>
      <a class="h-nav" href="tennis.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">05 TENNIS</a>
      <a class="h-nav" href="shell.html" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;border-right:1px solid #2c3025;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">06 SHELL</a>
      <a class="h-nav" href="index.html#contact" style="flex:1 1 0;min-width:96px;padding:11px 12px;font-size:11px;letter-spacing:.06em;text-decoration:none;display:flex;align-items:center;transition:background .12s,color .12s;">07 CONTACT</a>
    </div>

    <!-- breadcrumb -->
    <div style="padding:11px 30px;border-bottom:1px solid #2c3025;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:#6f7a5e;">
      <a class="h-hl" href="cities.html" style="text-decoration:none;color:#a7d17e;">CITIES</a> / FIELD GUIDE / <span id="fg-crumb">PARIS</span>
    </div>

    <!-- city switcher -->
    <div style="display:flex;flex-wrap:wrap;border-bottom:1px solid #2c3025;font-family:'IBM Plex Mono',monospace;">
      <a id="tab-paris" class="h-tab" href="#paris" style="padding:13px 24px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-right:1px solid #2c3025;">Paris</a>
      <a id="tab-nyc" class="h-tab" href="#nyc" style="padding:13px 24px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-right:1px solid #2c3025;">New York</a>
      <span style="padding:13px 24px;font-size:11px;color:#6f7a5e;align-self:center;">more cities coming</span>
    </div>

    <!-- header -->
    <div style="padding:40px 30px 30px;border-bottom:1px solid #2c3025;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f7a5e;">Field Guide</div>
      <h1 id="fg-title" style="font-weight:700;font-size:clamp(46px,12vw,88px);line-height:.9;letter-spacing:-.03em;margin:12px 0 0;text-transform:uppercase;">Paris</h1>
      <p id="fg-tag" style="font-size:16px;line-height:1.6;color:#c9d1bd;margin:18px 0 0;max-width:64ch;"></p>
      <p id="fg-note" style="font-size:14px;line-height:1.7;color:#9fb083;margin:18px 0 0;max-width:74ch;border-left:3px solid #e9e42e;padding-left:14px;"></p>
    </div>

    <!-- map -->
    <div style="border-bottom:1px solid #2c3025;">
      <div style="padding:12px 30px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f7a5e;border-bottom:1px solid #2c3025;background:#0b0d0a;">▸ Map · <span id="fg-map-label">PARIS</span></div>
      <div id="fg-map-placeholder" style="height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d0a;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#6f7a5e;text-transform:uppercase;">Interactive map</div>
        <button id="fg-load" class="h-load" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:11px 20px;background:#a7d17e;color:#0f110d;border:1px solid #a7d17e;cursor:pointer;">Load map ▸</button>
      </div>
      <div id="fg-map" style="height:420px;width:100%;display:none;"></div>
    </div>

    <!-- categories -->
    <div id="fg-cats"></div>

    <!-- footer -->
    <div style="padding:26px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6f7a5e;">
      <a href="cities.html" style="text-decoration:none;color:#a7d17e;border-bottom:1px solid #a7d17e;padding-bottom:2px;letter-spacing:.04em;">← ALL CITIES</a>
      <a href="index.html" style="text-decoration:none;color:#a7d17e;border-bottom:1px solid #a7d17e;padding-bottom:2px;letter-spacing:.04em;">THE WORLD →</a>
    </div>

  </div>
</div>

<script>
(function () {
  var GUIDES = {
    paris: {
      title: 'Paris',
      tag: 'A special place on earth where it both simultaneously feels like a small town, yet also a large cosmopolitan city where fashion, art, beauty, and the art of slow living come together.',
      note: "A few universal rules: every boulangerie is baseline good. Visit the bookstores, Paris does them the best. Spend most of your time wandering, and let Paris guide you where it wants you to go.",
      center: [48.858, 2.32], zoom: 12,
      cats: [
        { name: 'Fitness', items: [
          { name: 'Burning Bar', meta: '42 Avenue Raymond Poincaré · 16th arr.', lat: 48.8687, lng: 2.2865, desc: "Hot pilates, afrohouse music, mood lighting, French-speaking instructors. My favorite workout class in the entire world (I don't say that lightly)." }
        ]},
        { name: 'Museums', items: [
          { name: 'Musée Rodin', meta: '77 Rue de Varenne · 7th arr.', lat: 48.8553, lng: 2.3159, desc: 'One of the most peaceful museums in Paris, with a garden that you can spend hours in, daydreaming. Plan to stay longer than you think and go on a sunny afternoon.' },
          { name: 'Fondation Louis Vuitton', meta: '8 Avenue du Mahatma Gandhi · Bois de Boulogne', lat: 48.8766, lng: 2.2633, desc: "Their exhibits are intentional and well structured. One exhibit at a time, each level tracing the arc of the artist's life: the inspirations, the catalysts, the turning points. You leave understanding why someone made the work as much as what it is." }
        ]},
        { name: 'Restaurants', items: [
          { name: "Au P'tit Curieux", meta: '27 Rue de Sambre-et-Meuse · 10th arr.', lat: 48.8755, lng: 2.3720, desc: 'My best friend Mackenzie and I have had multiple four-hour dinners here, sometimes twice in the same trip. The owner is funny and charming. One of those places you come back to without deciding to.' },
          { name: 'Cojean', meta: '28 Rue du Bac · 7th arr.', lat: 48.8580, lng: 2.3270, desc: 'Healthy bowls clearly marked with protein content. If I lived in Paris full time, this would be my daily fast casual. Locations across the city.' }
        ]},
        { name: 'Parks', items: [
          { name: 'Jardin du Luxembourg', meta: '6th arr.', lat: 48.8462, lng: 2.3372, desc: 'The most beautiful park in the world! Tennis courts you can reserve in advance, surrounded by beautifully landscaped trees.' }
        ]},
        { name: 'Shopping', items: [
          { name: 'Citypharma', meta: '26 Rue du Four · 6th arr.', lat: 48.8530, lng: 2.3330, desc: "I swear by French pharmacy goods. Go in with a list, leave with fifteen other things." },
          { name: 'From Future', meta: 'Le Marais · multiple locations', lat: 48.8590, lng: 2.3610, desc: "Delightful, colorful cashmere in the most charming little store. You'll wear it all winter." }
        ]},
        { name: 'Tennis', items: [
          { name: 'Roland-Garros', meta: '2 Avenue Gordon Bennett · 16th arr. · late May – early June', lat: 48.8470, lng: 2.2530, desc: 'Iconic, beautiful, peaceful, and so, so clean. The red clay is legendary and the battles here are hard fought and won. Easy to get in and out from the center of Paris.' }
        ]},
        { name: 'Explore', items: [
          { name: 'Rue du Bac', meta: '7th arr.', lat: 48.8560, lng: 2.3260, desc: 'Walk the whole thing, from the Seine to Bon Marché. A super charming street in Paris.' },
          { name: 'Saint-Germain-des-Prés', meta: '6th arr.', lat: 48.8540, lng: 2.3340, desc: 'One of the most adored arrondissements of Paris. Little restaurants, famous shops, people hanging out. Just walk around.' },
          { name: 'The Seine at Sunset', meta: 'Les Berges de la Seine', lat: 48.8600, lng: 2.3200, desc: 'Go for a run here during sunset. One of the best running routes in the world, and yes, I am completely biased about this city.' }
        ]}
      ]
    },
    nyc: {
      title: 'New York',
      tag: 'Home. The city that rewards you for being exactly who you are, as long as you keep moving.',
      note: null,
      center: [40.75, -73.96], zoom: 11,
      cats: [
        { name: 'Coffee', items: [
          { name: 'Watchhouse', meta: '660 Fifth Avenue · Midtown', lat: 40.7597, lng: -73.9776, desc: 'A London import with a very cute, quaint, upscale teddy-bear-like decor. Great pastries, coffee, and design.' },
          { name: 'La Cabra', meta: '284 Lafayette Street · SoHo', lat: 40.7237, lng: -73.9962, desc: 'A Copenhagen coffee shop that landed in SoHo and kept all its calm. Single origin, very good, always packed, but seats open up quickly.' }
        ]},
        { name: 'Restaurants', items: [
          { name: 'Torrisi', meta: '275 Mulberry Street · NoLIta', lat: 40.7237, lng: -73.9960, desc: 'Order the martini, order the fusilli, and go with your best friend.' },
          { name: 'Atomix', meta: '104 East 30th Street · NoMad', lat: 40.7440, lng: -73.9830, desc: "Two Michelin stars and somehow the most welcoming room in New York. A Korean tasting menu done in a way that makes you forget you're at a tasting menu, but you'll remember it years later." },
          { name: 'Yunnan Rice Noodle House', meta: '274 Grand Street · Chinatown', lat: 40.7180, lng: -73.9950, desc: 'Open 24 hours, complimentary noodle refills, sit in the back for more peace and quiet.' },
          { name: "L'Industrie", meta: '197 Grand Street · Little Italy', lat: 40.7190, lng: -73.9970, desc: "Get the fig pizza, and eat it hot! I hosted a work happy hour for 300 people and this was the first one gone, if that's enough data." }
        ]},
        { name: 'Bookshops', items: [
          { name: 'McNally Jackson', meta: 'SoHo, Williamsburg & more', lat: 40.7235, lng: -73.9970, desc: 'My favorite independent bookshop in the city. Multiple locations, and the vibe is perfect at every one.' }
        ]},
        { name: 'Museums', items: [
          { name: 'The Whitney', meta: '99 Gansevoort Street · Meatpacking', lat: 40.7396, lng: -74.0089, desc: "More New Yorkers per square foot than any other museum in the city, which tells you it's the right one. Don't skip the fifth floor views." },
          { name: 'The Met', meta: '1000 Fifth Avenue · Upper East Side', lat: 40.7794, lng: -73.9632, desc: "I've been over fifteen times and still feel excited to explore more. Don't attempt the whole thing in one visit. Pick a wing, go deep, come back another day." }
        ]},
        { name: 'Tennis', items: [
          { name: 'US Open', meta: 'Flushing Meadows · Queens · late Aug – early Sep', lat: 40.7500, lng: -73.8450, desc: 'Fun, frenetic, overpriced, but the only Grand Slam in the western hemisphere. Worth every penny and every hour of chaos.' }
        ]},
        { name: 'Parks', items: [
          { name: 'Domino Park', meta: '15 River Street · Williamsburg', lat: 40.7145, lng: -73.9673, desc: 'The best waterfront park in the city. The view of Manhattan from the Williamsburg side is genuinely one of my favorite things about living here.' },
          { name: 'Central Park Reservoir', meta: 'Central Park · Upper West & East Side', lat: 40.7859, lng: -73.9625, desc: 'The first time I came here it took my breath away. Your first time is going to be the best time.' }
        ]}
      ]
    }
  };

  var city = 'paris';
  var mapOpen = false;
  var map = null, markers = null, mapTimer = null, tries = 0;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderContent() {
    var g = GUIDES[city];
    var up = g.title.toUpperCase();
    document.getElementById('fg-crumb').textContent = up;
    document.getElementById('fg-map-label').textContent = up;
    document.getElementById('fg-title').textContent = g.title;
    document.getElementById('fg-tag').textContent = g.tag;
    var noteEl = document.getElementById('fg-note');
    if (g.note) { noteEl.textContent = g.note; noteEl.style.display = ''; }
    else { noteEl.style.display = 'none'; }

    // tabs
    var tabs = { paris: document.getElementById('tab-paris'), nyc: document.getElementById('tab-nyc') };
    Object.keys(tabs).forEach(function (k) {
      if (k === city) { tabs[k].style.color = '#0f110d'; tabs[k].style.background = '#a7d17e'; }
      else { tabs[k].style.color = '#9fb083'; tabs[k].style.background = 'transparent'; }
    });

    // categories
    var html = '';
    g.cats.forEach(function (cat) {
      html += '<div style="border-bottom:1px solid #2c3025;">';
      html += '<div style="padding:12px 30px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6f7a5e;border-bottom:1px solid #2c3025;background:#0b0d0a;">▸ ' + esc(cat.name) + '</div>';
      cat.items.forEach(function (it) {
        html += '<div style="padding:18px 30px;border-bottom:1px solid #1c1f17;">';
        html += '<div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;">';
        html += '<span style="font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2;">' + esc(it.name) + '</span>';
        html += '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:#6f7a5e;letter-spacing:.03em;">' + esc(it.meta) + '</span>';
        html += '</div>';
        html += '<p style="margin:8px 0 0;font-size:14px;line-height:1.6;color:#c9d1bd;max-width:78ch;">' + esc(it.desc) + '</p>';
        html += '</div>';
      });
      html += '</div>';
    });
    document.getElementById('fg-cats').innerHTML = html;
  }

  function loadLeaflet() {
    if (window.L) return;
    if (!document.getElementById('fg-leaflet-css')) {
      var css = document.createElement('link');
      css.id = 'fg-leaflet-css'; css.rel = 'stylesheet';
      css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(css);
    }
    if (!document.getElementById('fg-leaflet-js')) {
      var js = document.createElement('script');
      js.id = 'fg-leaflet-js'; js.async = true;
      js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      document.head.appendChild(js);
    }
  }

  function initMap() {
    loadLeaflet();
    tries = 0;
    (function tryInit() {
      try {
        var el = document.getElementById('fg-map');
        if (!window.L || !el) { if (++tries < 80) mapTimer = setTimeout(tryInit, 120); return; }
        map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
        }).addTo(map);
        markers = L.layerGroup().addTo(map);
        drawMarkers();
      } catch (e) { console.warn('map init failed', e); }
    })();
  }

  function drawMarkers() {
    if (!map || !markers) return;
    markers.clearLayers();
    var g = GUIDES[city];
    var pts = [];
    var icon = L.divIcon({ className: '', html: '<div class="fg-pin"></div>', iconSize: [16, 16], iconAnchor: [8, 15], popupAnchor: [0, -14] });
    g.cats.forEach(function (cat) {
      cat.items.forEach(function (it) {
        if (typeof it.lat !== 'number') return;
        pts.push([it.lat, it.lng]);
        L.marker([it.lat, it.lng], { icon: icon })
          .bindPopup('<div style="font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:14px;color:#e6ecd7;">' + it.name + '</div><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#6f7a5e;letter-spacing:.03em;margin-top:3px;">' + cat.name + ' · ' + it.meta + '</div>')
          .addTo(markers);
      });
    });
    var fit = function () {
      if (!map) return;
      map.invalidateSize();
      if (pts.length) map.fitBounds(pts, { padding: [40, 40] });
      else map.setView(g.center, g.zoom);
    };
    fit();
    setTimeout(fit, 120);
  }

  function openMap() {
    mapOpen = true;
    document.getElementById('fg-map-placeholder').style.display = 'none';
    document.getElementById('fg-map').style.display = 'block';
    try { initMap(); } catch (e) { console.warn('map init failed', e); }
  }

  function syncHash() {
    var h = (location.hash || '').replace('#', '').toLowerCase();
    var next = (h === 'nyc' || h === 'paris') ? h : city;
    if (next !== city) {
      city = next;
      renderContent();
      if (mapOpen) { try { drawMarkers(); } catch (e) { console.warn('map redraw failed', e); } }
    }
  }

  document.getElementById('fg-load').addEventListener('click', openMap);
  window.addEventListener('hashchange', syncHash);

  // initial
  var h0 = (location.hash || '').replace('#', '').toLowerCase();
  if (h0 === 'nyc' || h0 === 'paris') city = h0;
  renderContent();
})();
</script>
</body>
</html>
