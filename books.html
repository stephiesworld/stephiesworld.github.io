<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites — Stephie's World</title>
  <meta name="description" content="A few of Stephanie Del Paggio's favorite books, and why they stuck.">
  <link rel="canonical" href="https://stephiesworld.com/books.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="world.css">
  <style>
    .books-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 40px 28px; max-width: 720px; margin: 8px auto 0;
    }
    .book-bubble { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .bubble-ring {
      width: 128px; height: 190px; border-radius: 3px; overflow: hidden;
      border: 0.5px solid var(--rule);
      box-shadow: 0 10px 26px -16px rgba(139,30,47,0.5);
      transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1), border-color 0.3s;
    }
    .book-bubble:hover .bubble-ring { transform: translateY(-8px); border-color: var(--cherry); }
    .book-bubble.active .bubble-ring { border-color: var(--cherry); }
    .bubble-ring img {
      width: 100%; height: 100%; object-fit: cover; object-position: center top;
      filter: saturate(0.92); transition: filter 0.4s;
    }
    .book-bubble:hover .bubble-ring img { filter: saturate(1.05); }
    .bubble-title {
      font-family: var(--serif); font-style: italic; font-size: 15px;
      color: var(--ink-mute); text-align: center; margin-top: 12px; line-height: 1.35;
      transition: color 0.3s; max-width: 130px;
    }
    .book-bubble:hover .bubble-title, .book-bubble.active .bubble-title { color: var(--cherry); }

    .detail-overlay {
      position: fixed; inset: 0; background: rgba(92,17,30,0.28); z-index: 90;
      opacity: 0; visibility: hidden; transition: opacity 0.35s, visibility 0.35s;
    }
    .detail-overlay.visible { opacity: 1; visibility: visible; }
    .book-detail {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper);
      border-top: 1px solid var(--rule); padding: 40px var(--page-pad) 48px;
      z-index: 100; transform: translateY(100%); transition: transform 0.4s;
      max-height: 60vh; overflow-y: auto; box-shadow: 0 -20px 60px -30px rgba(139,30,47,0.5);
    }
    .book-detail.visible { transform: translateY(0); }
    .detail-inner { max-width: 560px; margin: 0 auto; }
    .detail-close {
      position: absolute; top: 20px; right: 28px; background: none; border: none;
      color: var(--ink-faint); font-size: 20px; cursor: pointer; line-height: 1; transition: color 0.3s;
    }
    .detail-close:hover { color: var(--cherry); }
    .detail-category { font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cherry-bright); margin-bottom: 10px; }
    .detail-title { font-family: var(--serif); font-style: italic; font-size: clamp(26px,3vw,34px); color: var(--cherry); line-height: 1.15; }
    .detail-author { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); margin: 8px 0 18px; }
    .detail-desc { font-family: var(--serif); font-size: 18px; line-height: 1.7; color: var(--ink-soft); }

    @media (max-width: 768px) {
      .books-grid { grid-template-columns: repeat(2, 1fr); gap: 30px 20px; }
      .bubble-ring { width: 108px; height: 160px; }
    }
  </style>
</head>
<body>
  <div class="room">
    <nav class="room-nav">
      <a href="reading.html" class="back"><em>← reading</em></a>
      <span class="folio">favorites</span>
    </nav>

    <header class="room-head" style="border-bottom:none; padding-bottom:24px;">
      <div>
        <p class="eyebrow">the shelf, expanded</p>
        <h1>Favorites</h1>
      </div>
      <p class="intro">A few I keep coming back to. Tap a spine to hear why.</p>
    </header>

    <div class="books-grid" id="booksGrid"></div>

    <footer class="room-foot">
      <span class="mark">❦</span>
      <p><a href="reading.html">back to reading</a></p>
    </footer>
  </div>

  <div class="detail-overlay" id="detailOverlay"></div>
  <div class="book-detail" id="bookDetail">
    <button class="detail-close" id="detailClose">&times;</button>
    <div class="detail-inner">
      <p class="detail-category">Favorite</p>
      <p class="detail-title" id="detailTitle"></p>
      <p class="detail-author" id="detailAuthor"></p>
      <p class="detail-desc" id="detailDesc"></p>
    </div>
  </div>

  <script>
    var books = [
      { title: 'Klara and the Sun', author: 'Kazuo Ishiguro', isbn: '9780571364886', desc: 'One of my favorite books of all time. Ishiguro writes from the perspective of an artificial friend observing the humans around her — and by the end, you\'ve thought more deeply about love, sacrifice, and what it means to be a person than you expected.' },
      { title: 'The Creative Act', author: 'Rick Rubin', isbn: '9780593652886', desc: 'A Bible to creative living that I return to again and again. Less about making art and more about how to exist in the world as someone who pays attention.' },
      { title: "Man's Search for Meaning", author: 'Viktor Frankl', isbn: '9780807014271', desc: 'Viktor Frankl\'s account of surviving the Holocaust and the philosophy of meaning he built from it. The argument is simple: those who have a why can bear almost any how.' },
      { title: 'When Breath Becomes Air', author: 'Paul Kalanithi', isbn: '9780812988406', desc: 'You will laugh, you will cry. A neurosurgeon diagnosed with terminal cancer writes about what makes a life worth living — from both sides of the operating table. Left a lasting impression ten years later.' },
      { title: 'The Inner Game of Tennis', author: 'W. Timothy Gallwey', isbn: '9780679778318', desc: 'Trust your body. Quiet the mind. Trust the instinct that has thousands of years of history. That\'s the summary — and it applies to everything, not just tennis.' },
      { title: 'Open', author: 'Andre Agassi', isbn: '9780307388407', desc: 'An incredibly vulnerable and honest account of a top tennis player. Agassi hated tennis for most of his career — and somehow that makes it one of the most compelling sports memoirs ever written.' },
      { title: 'Brave New World', author: 'Aldous Huxley', isbn: '9780060850524', desc: '' },
      { title: 'The Wedding People', author: 'Alison Espach', isbn: '9781250284426', desc: 'One of my favorite books of 2025. This one found me in a Parisian bookshop and spoke to me.' }
    ];

    var grid = document.getElementById('booksGrid');
    books.forEach(function (book) {
      var bubble = document.createElement('div');
      bubble.className = 'book-bubble';
      var ring = document.createElement('div');
      ring.className = 'bubble-ring';
      var img = document.createElement('img');
      img.alt = book.title;
      img.src = 'https://covers.openlibrary.org/b/isbn/' + book.isbn + '-L.jpg';
      img.onerror = function () { this.onerror = null; this.src = 'https://books.google.com/books/content?vid=ISBN' + book.isbn + '&printsec=frontcover&img=1&zoom=1&source=gbs_api'; };
      var titleEl = document.createElement('p');
      titleEl.className = 'bubble-title';
      titleEl.textContent = book.title;
      ring.appendChild(img);
      bubble.appendChild(ring);
      bubble.appendChild(titleEl);
      bubble.addEventListener('click', function () {
        document.querySelectorAll('.book-bubble').forEach(function (b) { b.classList.remove('active'); });
        bubble.classList.add('active');
        document.getElementById('detailTitle').textContent = book.title;
        document.getElementById('detailAuthor').textContent = book.author;
        document.getElementById('detailDesc').textContent = book.desc;
        document.getElementById('bookDetail').classList.add('visible');
        document.getElementById('detailOverlay').classList.add('visible');
      });
      grid.appendChild(bubble);
    });

    function closeDetail() {
      document.getElementById('bookDetail').classList.remove('visible');
      document.getElementById('detailOverlay').classList.remove('visible');
      document.querySelectorAll('.book-bubble').forEach(function (b) { b.classList.remove('active'); });
    }
    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', closeDetail);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });
  </script>
</body>
</html>
