<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading — Stephie's World</title>
  <meta name="description" content="Stephie's favorite books.">
  <link rel="canonical" href="https://stephiesworld.com/books.html">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Tilt+Neon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="neon.css?v=20261008">
  <style>
    body { font-weight: 400; }
    body { overflow-y: auto; overflow-x: hidden; }

    .top {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.8rem 2.4rem 1.2rem;
      background: linear-gradient(to bottom, rgba(22, 26, 46, 0.95), transparent);
    }
    .top .nav { display: flex; gap: 1.6rem; }

    header { position: relative; z-index: 3; text-align: center; padding: 8rem 2rem 1rem; opacity: 0; animation: appear 1.2s ease 0.2s forwards; }
    .title { display: inline-flex; align-items: baseline; gap: 0.8rem; }
    .title h1 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2.6rem; color: var(--cream); }
    header .hud { margin-top: 0.8rem; font-size: 0.64rem; }

    /* The shelf: books stand on a lit ledge, full colour, like a shop window at night */
    .shelves { position: relative; z-index: 3; max-width: 940px; margin: 2.6rem auto 7rem; padding: 0 2.4rem; }
    .shelf { position: relative; display: grid; grid-template-columns: repeat(var(--per), 1fr); gap: 0 1.6rem; margin-bottom: 4.2rem; }
    .shelf::before {
      content: ''; position: absolute; left: -1.2rem; right: -1.2rem; top: var(--stand); height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--amber) 12%, #ffe0b8 50%, var(--amber) 88%, transparent);
      box-shadow: 0 0 8px var(--amber-soft), 0 0 26px rgba(255, 177, 92, 0.3);
    }
    /* the light the ledge throws down the wall */
    .shelf::after {
      content: ''; position: absolute; left: 4%; right: 4%; top: calc(var(--stand) + 2px); height: 70px; pointer-events: none;
      background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(255, 177, 92, 0.13), transparent 70%);
    }

    .book { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: inherit; opacity: 0; animation: rise 0.9s ease forwards; }
    .stand { height: var(--stand); width: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .tome {
      position: relative; width: var(--w); border-radius: 1px 3px 3px 1px;
      transform-origin: 50% 100%;
      box-shadow: 0 1px 0 rgba(255, 177, 92, 0.35), 6px 10px 22px rgba(0, 0, 0, 0.55), 1px 2px 4px rgba(0, 0, 0, 0.5);
      transition: transform 0.45s cubic-bezier(.2, .8, .2, 1), box-shadow 0.45s ease;
    }
    .tome img { display: block; width: 100%; max-height: calc(var(--stand) - 14px); object-fit: cover; border-radius: inherit; filter: brightness(0.82) saturate(0.9); transition: filter 0.45s ease; }
    /* spine crease on the left, a sheen across the jacket, and amber bounce-light from the ledge */
    .tome::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0, rgba(255, 255, 255, 0.16) 3px, rgba(0, 0, 0, 0.22) 7px, transparent 14px),
        linear-gradient(118deg, rgba(255, 255, 255, 0.14) 0%, transparent 32%),
        linear-gradient(0deg, rgba(255, 177, 92, 0.22), transparent 22%);
    }
    .tome::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); pointer-events: none; }

    .book:hover .tome, .book:focus-visible .tome, .book.active .tome {
      transform: translateY(-12px) rotate(-1.2deg);
      box-shadow: 0 0 0 1px rgba(255, 177, 92, 0.5), 0 0 28px rgba(255, 177, 92, 0.35), 0 22px 40px rgba(0, 0, 0, 0.6);
    }
    .book:hover img, .book:focus-visible img, .book.active img { filter: none; }
    .book:focus-visible { outline: none; }

    .caption { margin-top: 1.5rem; text-align: center; max-width: 11rem; }
    .book-title { display: block; font-family: var(--serif); font-style: italic; font-size: 1rem; line-height: 1.3; color: var(--cream-dim); transition: color 0.3s ease, text-shadow 0.3s ease; }
    .book-author { display: block; margin-top: 0.45rem; font-size: 0.58rem; color: var(--cream-faint); }
    .book:hover .book-title, .book.active .book-title { color: #fff1dc; text-shadow: 0 0 12px rgba(255, 177, 92, 0.45); }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .book { animation: none; opacity: 1; } .tome { transition: none; } }

    /* Currently reading */
    .now { position: relative; z-index: 3; max-width: 560px; margin: 3rem auto 0; padding: 0 2.4rem; opacity: 0; animation: appear 1.2s ease 0.3s forwards; }
    .now-label, .fav-label { font-size: 0.64rem; margin-bottom: 0.9rem; }
    .now ul { list-style: none; }
    .now li { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.7rem 0; border-top: 1px solid var(--line); }
    .now li:last-child { border-bottom: 1px solid var(--line); }
    .now .t { font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--cream); }
    .now .a { font-size: 0.64rem; white-space: nowrap; }
    .now-note { margin-top: 0.9rem; font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--cream-faint); }
    .now-note a { color: var(--cream-dim); border-bottom: 1px solid var(--neon-soft); }
    .now-note a:hover { color: var(--cream); }
    .fav-label { position: relative; z-index: 3; text-align: center; margin: 4.5rem 0 0; }

    /* Detail */
    .sheet {
      position: fixed; z-index: 30; left: 50%; bottom: 0; width: min(620px, 100%);
      transform: translate(-50%, 100%); transition: transform 0.5s ease;
      padding: 2.2rem 2.4rem 2.6rem;
      background: linear-gradient(160deg, rgba(36, 41, 72, 0.94), rgba(20, 23, 41, 0.97));
      border: 1px solid var(--line); border-top: 1px solid var(--neon-soft);
      box-shadow: 0 -10px 50px rgba(255, 122, 146, 0.1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet .k { font-size: 0.64rem; color: var(--neon); }
    .sheet h2 { margin-top: 0.6rem; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.9rem; line-height: 1.15; color: var(--cream); }
    .sheet .a { margin-top: 0.4rem; font-size: 0.64rem; }
    .sheet p.d { margin-top: 1.2rem; font-family: var(--read); font-size: 1.08rem; line-height: 1.65; color: var(--cream-dim); }
    .close { position: absolute; top: 0.9rem; right: 1rem; background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; color: var(--cream-faint); }
    .close:hover { color: var(--cream); }


    @media (max-width: 760px) {
      .top { padding: 1.2rem 1rem 1rem; }
      .top .nav { gap: 1rem; }
      header { padding-top: 6rem; }
      .shelves { padding: 0 1.4rem; }
      .shelf { gap: 0 1.2rem; margin-bottom: 3.4rem; }
      .now { padding: 0 1rem; }
      .now li { flex-direction: column; gap: 0.1rem; }
      .sheet { padding: 1.8rem 1.2rem 2.2rem; }
    }
  </style>
</head>
<body>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="index.html" class="home-link">Stephie&rsquo;s World</a>
    <nav class="signs" aria-label="Site">
      <a href="about.html" class="sign teal">about</a>
      <a href="books.html" class="sign amber" aria-current="page">reading</a>
      <a href="writing.html" class="sign teal">writing</a>
      <a href="builds.html" class="sign pink framed">builds &rarr;</a>
    </nav>
  </div>

  <header>
    <div class="title"><h1 class="title-sign amber" style="font-size: 2rem;">Reading</h1></div>
  </header>


  <p class="fav-label hud">favorites</p>
  <div class="shelves" id="shelves"></div>


  <aside class="sheet" id="sheet" aria-live="polite">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <p class="k hud">favorite</p>
    <h2 id="dTitle"></h2>
    <p class="a hud" id="dAuthor"></p>
    <p class="d" id="dDesc"></p>
  </aside>

  <script src="rain.js?v=20261008"></script>
  <script>
    var books = [
      { title: 'Klara and the Sun', author: 'Kazuo Ishiguro', cover: 'klara',
        desc: 'One of my favorite books of all time. Ishiguro writes from the perspective of an artificial friend observing the humans around her, and by the end, you&rsquo;ve thought more deeply about love, sacrifice, and what it means to be a person than you expected.' },
      { title: 'The Creative Act', author: 'Rick Rubin', cover: 'creative-act',
        desc: 'A Bible to creative living that I return to again and again. Less about making art and more about how to exist in the world as someone who pays attention.' },
      { title: 'Man&rsquo;s Search for Meaning', author: 'Viktor Frankl', cover: 'mans-search',
        desc: 'Viktor Frankl&rsquo;s account of surviving the Holocaust and the philosophy of meaning he built from it. The argument is simple: those who have a why can bear almost any how.' },
      { title: 'When Breath Becomes Air', author: 'Paul Kalanithi', cover: 'breath',
        desc: 'You will laugh, you will cry. A neurosurgeon diagnosed with terminal cancer writes about what makes a life worth living, from both sides of the operating table. Left a lasting impression ten years later.' },
      { title: 'The Inner Game of Tennis', author: 'W. Timothy Gallwey', cover: 'inner-game',
        desc: '' },
      { title: 'Open', author: 'Andre Agassi', cover: 'open',
        desc: 'An incredibly vulnerable and honest account of a top tennis player. Agassi hated tennis for most of his career, and somehow that makes it one of the most compelling sports memoirs ever written.' },
      { title: 'Brave New World', author: 'Aldous Huxley', cover: 'brave-new-world',
        desc: '' },
      { title: 'The Wedding People', author: 'Alison Espach', cover: 'wedding-people',
        desc: 'My favorite book of 2025. It&rsquo;s a book about falling in love.' },
      { title: 'Water', author: 'Rumi · tr. Gafori', cover: 'water',
        desc: '' },
      { title: 'Unreasonable Hospitality', author: 'Will Guidara', cover: 'unreasonable-hospitality',
        desc: '' }
    ];

    var shelves = document.getElementById('shelves');
    var sheet = document.getElementById('sheet');

    function show(b, el) {
      document.querySelectorAll('.book').forEach(function (x) { x.classList.toggle('active', x === el); });
      document.getElementById('dTitle').innerHTML = b.title;
      document.getElementById('dAuthor').textContent = b.author;
      document.getElementById('dDesc').innerHTML = b.desc;
      document.getElementById('dDesc').style.display = b.desc ? '' : 'none';
      sheet.classList.add('open');
    }

    // Lay the books out a shelf at a time, so every row stands on its own lit ledge
    var layout = '';
    function build() {
      var w = window.innerWidth;
      var per = w < 560 ? 2 : w < 980 ? 4 : 5;
      var size = w < 560 ? [118, 196] : [132, 214];
      var key = per + ':' + size[0];
      if (key === layout) return;
      layout = key;
      shelves.innerHTML = '';
      for (var r = 0; r < books.length; r += per) {
        var shelf = document.createElement('div');
        shelf.className = 'shelf';
        shelf.style.cssText = '--per:' + per + ';--w:' + size[0] + 'px;--stand:' + size[1] + 'px';
        books.slice(r, r + per).forEach(function (b, j) {
          var i = r + j;
          var el = document.createElement('button');
          el.className = 'book';
          el.style.animationDelay = (0.25 + i * 0.07) + 's';
          el.innerHTML =
            '<span class="stand"><span class="tome"><img alt="" src="images/books/' + b.cover + '.jpg"></span></span>' +
            '<span class="caption"><span class="book-title">' + b.title + '</span><span class="book-author hud">' + b.author + '</span></span>';
          el.addEventListener('click', function () { show(b, el); });
          shelf.appendChild(el);
        });
        shelves.appendChild(shelf);
      }
    }
    build();
    window.addEventListener('resize', build);

    function close() {
      sheet.classList.remove('open');
      document.querySelectorAll('.book').forEach(function (x) { x.classList.remove('active'); });
    }
    document.getElementById('close').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    startRain(document.getElementById('rain'), 0.5);
  </script>

  <script src="secret.js"></script>
</body>
</html>
