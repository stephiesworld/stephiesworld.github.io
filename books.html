<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading — Stephie's World</title>
  <meta name="description" content="Stephie's favorite books.">
  <link rel="canonical" href="https://stephiesworld.com/books.html">
  <meta property="og:image" content="https://stephiesworld.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="neon.css">
  <style>
    body { overflow-y: auto; overflow-x: hidden; }

    .top {
      position: fixed; z-index: 10; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.8rem 2.4rem 1.2rem;
      background: linear-gradient(to bottom, rgba(5, 5, 7, 0.95), transparent);
    }
    .top .nav { display: flex; gap: 1.6rem; }

    header { position: relative; z-index: 3; text-align: center; padding: 8rem 2rem 1rem; opacity: 0; animation: appear 1.2s ease 0.2s forwards; }
    .title { display: inline-flex; align-items: baseline; gap: 0.8rem; }
    .title h1 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2.6rem; color: var(--cream); }
    header .hud { margin-top: 0.8rem; font-size: 0.55rem; }

    .grid {
      position: relative; z-index: 3;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 3rem 2.2rem;
      max-width: 820px; margin: 2rem auto 6rem; padding: 0 2.4rem;
    }

    .book { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; opacity: 0; animation: appear 1s ease forwards; }
    .cover {
      width: 130px; aspect-ratio: 2 / 3; overflow: hidden; position: relative;
      border: 1px solid var(--line);
      animation: float 6s ease-in-out infinite;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.6) brightness(0.6) contrast(1.05); transition: filter 0.5s ease; }
    /* red wash, like a sign across the street */
    .cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(255, 45, 74, 0.22)); mix-blend-mode: screen; transition: opacity 0.4s ease; }
    .book:hover .cover, .book.active .cover { border-color: var(--neon-soft); box-shadow: 0 0 24px rgba(255, 45, 74, 0.25), 0 10px 40px rgba(0, 0, 0, 0.6); }
    .book:hover img, .book.active img { filter: none; }
    .book:hover .cover::after, .book.active .cover::after { opacity: 0; }

    .book-title { margin-top: 1rem; font-family: var(--serif); font-style: italic; font-size: 0.95rem; line-height: 1.35; text-align: center; color: var(--cream-faint); transition: color 0.3s ease; }
    .book:hover .book-title, .book.active .book-title { color: var(--cream); }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* Currently reading */
    .now { position: relative; z-index: 3; max-width: 560px; margin: 3rem auto 0; padding: 0 2.4rem; opacity: 0; animation: appear 1.2s ease 0.3s forwards; }
    .now-label, .fav-label { font-size: 0.55rem; margin-bottom: 0.9rem; }
    .now ul { list-style: none; }
    .now li { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.7rem 0; border-top: 1px solid var(--line); }
    .now li:last-child { border-bottom: 1px solid var(--line); }
    .now .t { font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--cream); }
    .now .a { font-size: 0.52rem; white-space: nowrap; }
    .now-note { margin-top: 0.9rem; font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--cream-faint); }
    .now-note a { color: var(--cream-dim); border-bottom: 1px solid var(--neon-soft); }
    .now-note a:hover { color: var(--cream); }
    .fav-label { position: relative; z-index: 3; text-align: center; margin: 4.5rem 0 0; }

    /* Detail */
    .sheet {
      position: fixed; z-index: 30; left: 50%; bottom: 0; width: min(620px, 100%);
      transform: translate(-50%, 100%); transition: transform 0.5s ease;
      padding: 2.2rem 2.4rem 2.6rem;
      background: linear-gradient(160deg, rgba(20, 8, 12, 0.92), rgba(5, 5, 7, 0.96));
      border: 1px solid var(--line); border-top: 1px solid var(--neon-soft);
      box-shadow: 0 -10px 50px rgba(255, 45, 74, 0.1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet .k { font-size: 0.52rem; color: var(--neon); }
    .sheet h2 { margin-top: 0.6rem; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.9rem; line-height: 1.15; color: var(--cream); }
    .sheet .a { margin-top: 0.4rem; font-size: 0.58rem; }
    .sheet p.d { margin-top: 1.2rem; font-family: var(--serif); font-size: 1.08rem; line-height: 1.65; color: var(--cream-dim); }
    .close { position: absolute; top: 0.9rem; right: 1rem; background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; color: var(--cream-faint); }
    .close:hover { color: var(--cream); }


    @media (max-width: 760px) {
      .top { padding: 1.2rem 1rem 1rem; }
      .top .nav { gap: 1rem; }
      header { padding-top: 6rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 2.4rem 1.4rem; padding: 0 1rem; }
      .cover { width: 120px; }
      .now { padding: 0 1rem; }
      .now li { flex-direction: column; gap: 0.1rem; }
      .sheet { padding: 1.8rem 1.2rem 2.2rem; }
    }
  </style>
</head>
<body>

  <canvas class="fx fx-rain" id="rain"></canvas>
  <div class="fx fx-vignette"></div>
  <div class="fx fx-scan"></div>
  <div class="fx fx-grain"></div>

  <div class="top">
    <a href="index.html" class="home-link">Stephie&rsquo;s World</a>
    <nav class="signs" aria-label="Site">
      <a href="about.html" class="sign teal">about</a>
      <a href="books.html" class="sign amber" aria-current="page">reading</a>
      <a href="work.html" class="sign pink framed">work &rarr;</a>
    </nav>
  </div>

  <header>
    <div class="title"><h1>Reading</h1></div>
  </header>


  <p class="fav-label hud">favorites</p>
  <div class="grid" id="grid"></div>


  <aside class="sheet" id="sheet" aria-live="polite">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <p class="k hud">favorite</p>
    <h2 id="dTitle"></h2>
    <p class="a hud" id="dAuthor"></p>
    <p class="d" id="dDesc"></p>
  </aside>

  <script src="rain.js"></script>
  <script>
    var books = [
      { title: 'Klara and the Sun', author: 'Kazuo Ishiguro', isbn: '9780571364886',
        desc: 'One of my favorite books of all time. Ishiguro writes from the perspective of an artificial friend observing the humans around her, and by the end, you&rsquo;ve thought more deeply about love, sacrifice, and what it means to be a person than you expected.' },
      { title: 'The Creative Act', author: 'Rick Rubin', isbn: '9780593652886',
        desc: 'A Bible to creative living that I return to again and again. Less about making art and more about how to exist in the world as someone who pays attention.' },
      { title: 'Man&rsquo;s Search for Meaning', author: 'Viktor Frankl', isbn: '9780807014271',
        desc: 'Viktor Frankl&rsquo;s account of surviving the Holocaust and the philosophy of meaning he built from it. The argument is simple: those who have a why can bear almost any how.' },
      { title: 'When Breath Becomes Air', author: 'Paul Kalanithi', isbn: '9780812988406',
        desc: 'You will laugh, you will cry. A neurosurgeon diagnosed with terminal cancer writes about what makes a life worth living, from both sides of the operating table. Left a lasting impression ten years later.' },
      { title: 'The Inner Game of Tennis', author: 'W. Timothy Gallwey', isbn: '9780679778318',
        desc: '' },
      { title: 'Open', author: 'Andre Agassi', isbn: '9780307388407',
        desc: 'An incredibly vulnerable and honest account of a top tennis player. Agassi hated tennis for most of his career, and somehow that makes it one of the most compelling sports memoirs ever written.' },
      { title: 'Brave New World', author: 'Aldous Huxley', isbn: '9780060850524',
        desc: '' },
      { title: 'The Wedding People', author: 'Alison Espach', isbn: '9781250284426',
        desc: 'My favorite book of 2025. It&rsquo;s a book about falling in love.' }
    ];

    var grid = document.getElementById('grid');
    var sheet = document.getElementById('sheet');

    books.forEach(function (b, i) {
      var el = document.createElement('button');
      el.className = 'book';
      el.style.animationDelay = (0.3 + i * 0.08) + 's';
      el.innerHTML =
        '<span class="cover" style="animation-delay:' + (-i * 0.75) + 's"><img alt="" loading="lazy" src="https://covers.openlibrary.org/b/isbn/' + b.isbn + '-L.jpg"></span>' +
        '<span class="book-title">' + b.title + '</span>';
      el.querySelector('img').onerror = function () {
        this.onerror = null;
        this.src = 'https://books.google.com/books/content?vid=ISBN' + b.isbn + '&printsec=frontcover&img=1&zoom=1&source=gbs_api';
      };
      el.addEventListener('click', function () {
        document.querySelectorAll('.book').forEach(function (x) { x.classList.toggle('active', x === el); });
        document.getElementById('dTitle').innerHTML = b.title;
        document.getElementById('dAuthor').textContent = b.author;
        document.getElementById('dDesc').innerHTML = b.desc;
        document.getElementById('dDesc').style.display = b.desc ? '' : 'none';
        sheet.classList.add('open');
      });
      grid.appendChild(el);
    });

    function close() {
      sheet.classList.remove('open');
      document.querySelectorAll('.book').forEach(function (x) { x.classList.remove('active'); });
    }
    document.getElementById('close').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    startRain(document.getElementById('rain'), 0.5);
  </script>

  <script src="secret.js"></script>
</body>
</html>
