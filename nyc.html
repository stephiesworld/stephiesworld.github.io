  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>

  <script src="citymap.js"></script>
  <script>
    cityMap({
      tz: 'America/New_York',
      bearing: 29, // Manhattan's grid runs ~29° off true north; this stands the avenues upright
      home: { center: [-73.982, 40.733], zoom: 12.6, pitch: 52 },
      bounds: [[-74.2, 40.55], [-73.7, 40.92]],

      groups: [
        { id: 'work', zh: '工作', label: 'work', big: true, labels: 'always', tagsLabel: 'what it taught me' },
        { id: 'play', zh: '玩', label: 'play', labels: 'hover', tagsLabel: 'for' },
        { id: 'guide', zh: '指南', label: 'guide', labels: 'hover', compact: true, tagsLabel: 'for' }
      ],

      places: [
        // ─── Work, in career order ───
        {
          id: 'ey', group: 'work', name: 'EY',
          role: 'Corporate Tax',
          address: '5 Times Square', lngLat: [-73.9876, 40.7558],
          tags: ['corporate tax']
        },
        {
          id: 'morganstanley', group: 'work', name: 'Morgan Stanley',
          role: 'Senior Data Science Analyst &middot; AI for Wealth Management', years: '2018 – 2019',
          address: '1585 Broadway', lngLat: [-73.9855, 40.7600],
          copy: 'Where I learned how emotional wealth management can be &mdash; that investing a person&rsquo;s assets ties to every desire and fear they could ever have. Also my first exposure to AI, through the <a href="https://www.forbes.com/sites/tomdavenport/2020/05/16/the-future-of-work-now-morgan-stanleys-financial-advisors-and-the-next-best-offer-system/" target="_blank" rel="noopener">Next Best Action</a> system.',
          tags: ['artificial intelligence', 'next best action', 'wealth management', 'fintech']
        },
        {
          id: 'harrys', group: 'work', name: 'Harry&rsquo;s',
          role: 'Senior Associate Program Manager &middot; Global R&amp;D', years: '2019 – 2021',
          address: '75 Varick Street', lngLat: [-74.0064, 40.7233],
          copy: 'Where I learned how to build new products and launch them into the world &mdash; with incredible, fun, kind people. When I showed up sick one day, a colleague said, &ldquo;Go home. We&rsquo;re just making razors, not curing cancer.&rdquo; I also learned about quality and intention: a razor is five mini knives that people put on their face.',
          tags: ['product development', 'manufacturing', 'global launches', 'consumer research']
        },
        {
          id: 'littlebun', group: 'work', name: 'Little Bun',
          role: 'Founder &amp; CEO', years: '2022 – 2024',
          address: '19 W 24th Street', note: 'incubated at FJ Labs', lngLat: [-73.9904, 40.7429],
          copy: 'Took everything I learned at Harry&rsquo;s, raised a little venture funding, and built a food startup. A big lesson in all the wrong things to do, honestly &mdash; but I wouldn&rsquo;t trade it.',
          tags: ['fundraising', 'manufacturing', 'automated machinery', 'michelin-star chef', 'retail sales'],
          links: [{ href: 'writing/the-dumpling-was-the-stress-test.html', label: 'read: the dumpling was the stress test' }]
        },
        {
          id: 'amazon', group: 'work', name: 'Amazon',
          role: 'Senior Customer Success Manager &middot; Pricing SME', years: '2024 – 2026',
          address: '410 Tenth Avenue', lngLat: [-73.9993, 40.7540],
          copy: 'Where I landed after Little Bun. As challenging as Amazon is known for being, it wasn&rsquo;t anything close to how hard you are on yourself as a founder. I found it surprisingly peaceful, and got to work with businesses to sell and grow. I loved learning the systems inside Amazon&rsquo;s world.',
          tags: ['customer success', 'pricing', 'machine learning', 'ai agents'],
          links: [{ href: 'writing/customer-signal-into-product.html', label: 'read: the sifting is the hard part' }]
        },

        // ─── Play ───
        { id: 'tennis', group: 'play', name: 'Tennis', address: 'Brooklyn', lngLat: [-73.9565, 40.7185], zoom: 13.6, tags: ['tennis'] },
        {
          id: 'westside', group: 'play', name: 'West Side Highway', address: 'Hudson River Greenway', lngLat: [-74.0106, 40.7336], tags: ['running'],
          route: [[-74.0175, 40.7050], [-74.0160, 40.7120], [-74.0137, 40.7178], [-74.0112, 40.7260], [-74.0104, 40.7335], [-74.0090, 40.7420], [-74.0085, 40.7470], [-74.0052, 40.7568], [-73.9996, 40.7645], [-73.9937, 40.7720]]
        },
        { id: 'domino', group: 'play', name: 'Domino Park', address: '15 River Street &middot; Williamsburg', lngLat: [-73.9683, 40.7141], copy: 'Anywhere water meets land. The best waterfront park in the city. The view of Manhattan from the Williamsburg side is genuinely one of my favorite things in the city.' },

        // ─── Guide ───
        { id: 'watchhouse', group: 'guide', category: 'coffee', name: 'Watchhouse', address: '660 Fifth Avenue &middot; Midtown', lngLat: [-73.9764, 40.7588],
          copy: 'A London import with a very cute, quaint, upscale teddy-bear-like decor. Great pastries, coffee, and design.' },
        { id: 'lacabra', group: 'guide', category: 'coffee', name: 'La Cabra', address: '284 Lafayette Street &middot; SoHo', lngLat: [-73.9972, 40.7239],
          copy: 'A Copenhagen coffee shop that landed in SoHo and kept all its calm. Single origin, very good, and it&rsquo;s always packed &mdash; but seats open up quickly.' },
        { id: 'torrisi', group: 'guide', category: 'restaurants', name: 'Torrisi', address: '275 Mulberry Street &middot; NoLIta', lngLat: [-73.9962, 40.7230],
          copy: 'Order the martini, order the fusilli, and go with your best friend.' },
        { id: 'atomix', group: 'guide', category: 'restaurants', name: 'Atomix', address: '104 East 30th Street &middot; NoMad', lngLat: [-73.9826, 40.7452],
          copy: 'Two Michelin stars and somehow the most welcoming room in New York. Korean tasting menu done in a way that makes you forget you&rsquo;re at a tasting menu, but will remember years later.' },
        { id: 'yunnan', group: 'guide', category: 'restaurants', name: 'Yunnan Rice Noodle House', address: '274 Grand Street &middot; Chinatown', lngLat: [-73.9953, 40.7163],
          copy: 'Open 24 hours, complimentary noodle refills, sit in the back for more peace and quiet.' },
        { id: 'lindustrie', group: 'guide', category: 'restaurants', name: 'L&rsquo;Industrie', address: '197 Grand Street &middot; Little Italy', lngLat: [-73.9977, 40.7191],
          copy: 'Order the fig pizza. I hosted a work happy hour for 300 people and this was the first one gone, if that&rsquo;s enough data.' },
        { id: 'mcnally-soho', group: 'guide', category: 'bookshops', name: 'McNally Jackson', address: 'SoHo, Williamsburg &amp; more', lngLat: [-73.9978, 40.7256],
          copy: 'My favorite independent bookshop in the city. Multiple locations &mdash; and the vibe is perfect at every one.' },
        { id: 'whitney', group: 'guide', category: 'museums', name: 'The Whitney', address: '99 Gansevoort Street &middot; Meatpacking', lngLat: [-74.0088, 40.7396],
          copy: 'More New Yorkers per square foot than any other museum in the city, which tells you it&rsquo;s the right one. Don&rsquo;t skip the fifth floor views.' },
        { id: 'met', group: 'guide', category: 'museums', name: 'The Met', address: '1000 Fifth Avenue &middot; Upper East Side', lngLat: [-73.9632, 40.7794],
          copy: 'I&rsquo;ve been over fifteen times &mdash; sometimes on my own and sometimes as a tour guide to friends &mdash; and still feel excited to explore more. Don&rsquo;t attempt to scale the whole thing in one visit &mdash; pick a wing, go deep, then come back another day.' },
        { id: 'reservoir', group: 'guide', category: 'parks', name: 'Central Park Reservoir', address: 'Central Park &middot; Upper West &amp; East Side', lngLat: [-73.9622, 40.7851],
          copy: 'The first time I came here it took my breath away. Your first time is going to be the best time.' },
        { id: 'usopen', group: 'guide', category: 'tennis', name: 'US Open', address: 'Flushing Meadows &middot; Queens', note: 'late August &ndash; early September', lngLat: [-73.8458, 40.7497], zoom: 14.5,
          copy: 'Fun, frenetic, overpriced &mdash; but the only Grand Slam in the western hemisphere. Worth every penny and every hour of chaos.' }
      ]
    });

    startRain(document.getElementById('rain'), 0.6);
  </script>
